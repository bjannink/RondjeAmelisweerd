        const overlapLength = calculateOverlap(edges);
        const overlapRatio = overlapLength / Math.max(length, 1);
        if (overlapRatio > maxOverlap + 1e-9) return;
        const immediateTurnaround = edges.some((edge, index) =>
          index > 0 && logicalBaseId(edge) === logicalBaseId(edges[index - 1])
        );
        const route = {
          routeType: "pointToPoint",
          routePreference: preference,
          startNodeId,
          endNodeId,
          startCoord: endpoints.start.coord,
          endCoord: endpoints.end.coord,
          startDistance: endpoints.start.distance,
          endDistance: endpoints.end.distance,
          snapSearchRadius: 250,
          shortestLength,
          edges,
          nodes,
          length,
          overlapLength,
          immediateTurnaroundPenalty: immediateTurnaround ? 0.75 : 0,
          source
        };
        Object.assign(route, scorePointToPointRoute(route, referenceDistance));
        route.coordinates = routeCoordinates(startNodeId, edges);
        routes.push(route);
      }

      if (preference === "shortest") {
        const yenResult = yenKShortestPaths(
          startNodeId,
          endNodeId,
          Math.min(CONFIG.maxResults * 3, Math.max(maxResults * 2, maxResults))
        );
        calculations = yenResult.calculations;
        yenResult.paths.forEach(path =>
          addCandidate(path.edges, path.nodes, "k-shortest")
        );
        const result = removeDuplicateRoutes(routes)
          .sort((a, b) => a.length - b.length || a.score - b.score)
          .slice(0, maxResults);
        console.log(
          `A→B k-kortste: ${calculations} berekeningen en ${result.length} unieke resultaten.`
        );
        return result;
      }

      addCandidate(directResult.path.edges, directResult.path.nodes, "shortest");
      const shortestBaseIds = new Set(
        directResult.path.edges.map(logicalBaseId)
      );

      for (const overlapPenalty of CONFIG.overlapPenalties) {
        if (calculations >= CONFIG.maxRouteCalculations) break;
        const alternative = dijkstra(startNodeId, endNodeId, {
          penalizedBaseEdges: shortestBaseIds,
          overlapPenalty
        });
        calculations++;
        if (alternative.path) {
          addCandidate(alternative.path.edges, alternative.path.nodes, "penalty");
        }
      }

      const blockableEdges = [...shortestBaseIds].slice(0, 28);
      for (const baseId of blockableEdges) {
        if (calculations >= CONFIG.maxRouteCalculations) break;
        const alternative = dijkstra(startNodeId, endNodeId, {
          blockedBaseEdges: new Set([baseId])
        });
        calculations++;
        if (alternative.path) {
          addCandidate(alternative.path.edges, alternative.path.nodes, "detour");
        }
      }

      const startTree = dijkstra(startNodeId);
      const endDistances = distancesToNode(endNodeId);
      calculations += 2;
      const waypointTarget = preference === "distance"
        ? targetDistance
        : shortestLength * 1.25;
      const waypoints = graph.nodes
        .filter(node =>
          node.id !== startNodeId &&
          node.id !== endNodeId &&
          Number.isFinite(startTree.dist[node.id]) &&
          Number.isFinite(endDistances[node.id])
        )
        .map(node => ({
          nodeId: node.id,
          estimatedLength: startTree.dist[node.id] + endDistances[node.id]
        }))
        .filter(item => preference === "distance"
          ? item.estimatedLength >= shortestLength * 0.95 &&
            item.estimatedLength <= targetDistance * (1 + Math.max(tolerance, 0.2))
          : item.estimatedLength <= shortestLength * 1.7
        )
        .sort((a, b) =>
          Math.abs(a.estimatedLength - waypointTarget) -
          Math.abs(b.estimatedLength - waypointTarget)
        )
        .slice(0, 24);

      for (const waypoint of waypoints) {
        if (calculations >= CONFIG.maxRouteCalculations) break;
        const outbound = reconstructPath(startTree, startNodeId, waypoint.nodeId);
        if (!outbound) continue;
        const outboundBaseIds = new Set(outbound.edges.map(logicalBaseId));
        for (const overlapPenalty of [3, 6, 12]) {
          if (calculations >= CONFIG.maxRouteCalculations) break;
          const inboundResult = dijkstra(waypoint.nodeId, endNodeId, {
            penalizedBaseEdges: outboundBaseIds,
            overlapPenalty
          });
          calculations++;
          if (!inboundResult.path) continue;
          addCandidate(
            [...outbound.edges, ...inboundResult.path.edges],
            [...outbound.nodes, ...inboundResult.path.nodes.slice(1)],
            "waypoint"
          );
        }
      }

      const result = removeDuplicateRoutes(routes)
        .sort((a, b) => a.score - b.score)
        .slice(0, maxResults);
      console.log(
        `A→B-zoekactie: ${calculations} berekeningen, ${routes.length} geldige ` +
        `kandidaten en ${result.length} unieke resultaten.`
      );
      return result;
    }

    function clearRouteLayers() {
      routeLayers.forEach(routeLayer => {
        map.removeLayer(routeLayer.halo);
        map.removeLayer(routeLayer.line);
      });
      routeLayers = [];
      waypointMarkers.forEach(marker => map.removeLayer(marker));
      waypointMarkers = [];
      if (actualStartMarker) map.removeLayer(actualStartMarker);
      if (actualEndMarker) map.removeLayer(actualEndMarker);
      if (startConnector) map.removeLayer(startConnector);
      if (endConnector) map.removeLayer(endConnector);
      actualStartMarker = null;
      actualEndMarker = null;
      startConnector = null;
      endConnector = null;
    }

    function routeCardMarkup(route, index) {
      if (route.routeType === "pointToPoint") {
        const deviationLabel = route.routePreference === "shortest"
          ? "Langer dan kortste"
          : "Afwijking";
        return `
          <span class="route-title">
            <span>Route ${index + 1}${route.edited ? " · aangepast" : ""}</span>
            <span class="route-distance">${numberNL.format(route.length)} meter</span>
          </span>
          <span class="route-meta">
            <span>${deviationLabel}: ${decimalNL.format(route.distanceDeviation * 100)}%</span>
            <span>Overlap: ${decimalNL.format(route.overlapRatio * 100)}%</span>
            <span class="wide">A: ${numberNL.format(route.startDistance)} m · B: ${numberNL.format(route.endDistance)} m van de kaartklik</span>
          </span>
        `;
      }
      return `
        <span class="route-title">
          <span>Ronde ${index + 1}${route.edited ? " · aangepast" : ""}</span>
          <span class="route-distance">${numberNL.format(route.length)} meter</span>
        </span>
        <span class="route-meta">
          <span>Afwijking: ${decimalNL.format(route.distanceDeviation * 100)}%</span>
          <span>Overlap: ${decimalNL.format(route.overlapRatio * 100)}%</span>
          <span class="wide">Startpunt: ${numberNL.format(route.startDistance)} meter van de kaartklik</span>
        </span>
      `;
    }

    function createRouteMapLayer(route, index) {
      const color = ROUTE_COLORS[index % ROUTE_COLORS.length];
      const latLngs = route.coordinates.map(coord => [coord[1], coord[0]]);
      const halo = L.polyline(latLngs, {
        color: "#ffffff",
        weight: 8,
        opacity: 0.5,
        lineCap: "round",
        lineJoin: "round",
        interactive: false
      }).addTo(map);
      const line = L.polyline(latLngs, {
        color,
        weight: 4.5,
        opacity: 0.58,
        lineCap: "round",
        lineJoin: "round",
        bubblingMouseEvents: false
      }).addTo(map);
      line.on("click", event => {
        stopLeafletClick(event);
        if (isEditingRoute() && index === selectedRouteIndex) {
          if (appState.interaction === INTERACTION.EDIT_PREVIEW) return;
          const edgeIndex = findNearestRouteEdgeIndex(route, event.latlng);
          if (edgeIndex !== null) selectEditSource(edgeIndex, event.latlng);
          return;
        }
        showResultsView(currentRoutes.length);
        selectRoute(index);
      });
      return { halo, line };
    }

    function replaceDisplayedRoute(index, route, zoom = false) {
      const oldLayer = routeLayers[index];
      if (oldLayer) {
        map.removeLayer(oldLayer.halo);
        map.removeLayer(oldLayer.line);
      }
      currentRoutes[index] = route;
      routeLayers[index] = createRouteMapLayer(route, index);
      const card = resultsElement.querySelector(`[data-route-index="${index}"]`);
      if (card) card.innerHTML = routeCardMarkup(route, index);
      selectRoute(index, zoom);
      updateEditControls();
    }

    function selectRoute(index, zoom = true) {
      const route = currentRoutes[index];
      if (!route) return;
      if (isEditingRoute()) endEditMode();
      selectedRouteIndex = index;
      routeLayers.forEach((routeLayer, layerIndex) => {
        const selected = layerIndex === index;
        if (selected) {
          if (!map.hasLayer(routeLayer.halo)) routeLayer.halo.addTo(map);
          if (!map.hasLayer(routeLayer.line)) routeLayer.line.addTo(map);
        } else {
          if (map.hasLayer(routeLayer.halo)) map.removeLayer(routeLayer.halo);
          if (map.hasLayer(routeLayer.line)) map.removeLayer(routeLayer.line);
        }
        routeLayer.halo.setStyle({
          weight: selected ? 12 : 8,
          opacity: selected ? 0.94 : 0.5
        });
        routeLayer.line.setStyle({
          weight: selected ? 7 : 4.5,
          opacity: selected ? 1 : 0.58
        });
        if (selected) {
          routeLayer.halo.bringToFront();
          routeLayer.line.bringToFront();
        }
      });
      [...resultsElement.querySelectorAll(".route-card")].forEach((card, cardIndex) => {
        card.classList.toggle("selected", cardIndex === index);
      });

      waypointMarkers.forEach(marker => map.removeLayer(marker));
      waypointMarkers = (route.waypoints || []).map((waypoint, waypointIndex) =>
        L.marker([waypoint.coord[1], waypoint.coord[0]], {
          icon: L.divIcon({ className: "waypoint-pin", html: "", iconSize: [14, 14] }),
          zIndexOffset: 1200,
          interactive: false
        }).addTo(map).bindTooltip(`Waypoint ${waypointIndex + 1}`)
      );

      if (actualStartMarker) map.removeLayer(actualStartMarker);
      if (actualEndMarker) map.removeLayer(actualEndMarker);
      if (startConnector) map.removeLayer(startConnector);
      if (endConnector) map.removeLayer(endConnector);
      const startCoord = route.startCoord || graph.nodes[route.startNodeId].coord;
      actualStartMarker = L.marker([startCoord[1], startCoord[0]], {
        icon: L.divIcon({ className: "start-pin", html: "", iconSize: [24, 24] }),
        zIndexOffset: 1000
      }).addTo(map).bindTooltip(
        route.routeType === "pointToPoint" ? "Werkelijk punt A" : "Werkelijk startpunt"
      );

      if (appState.points.start) {
        startConnector = L.polyline(
          [[appState.points.start.lat, appState.points.start.lng], [startCoord[1], startCoord[0]]],
          { color: "#005db9", weight: 2.5, dashArray: "5 6", opacity: 0.9 }
        ).addTo(map);
      }

      if (route.routeType === "pointToPoint") {
        const endCoord = route.endCoord || graph.nodes[route.endNodeId].coord;
        actualEndMarker = L.marker([endCoord[1], endCoord[0]], {
          icon: L.divIcon({ className: "end-pin", html: "", iconSize: [24, 24] }),
          zIndexOffset: 1000
        }).addTo(map).bindTooltip("Werkelijk punt B");
        if (appState.points.end) {
          endConnector = L.polyline(
            [[appState.points.end.lat, appState.points.end.lng], [endCoord[1], endCoord[0]]],
            { color: "#243f59", weight: 2.5, dashArray: "5 6", opacity: 0.9 }
          ).addTo(map);
        }
      }

      if (zoom) {
        map.fitBounds(routeLayers[index].line.getBounds(), {
          padding: [42, 42],
          maxZoom: 17
        });
      }
      updateEditControls();
    }

    function displayRoutes(routes, maxOverlap = CONFIG.maxOverlap) {
      endEditMode();
      clearRouteLayers();
      resultsElement.innerHTML = "";
      currentRoutes = routes;
      originalRoutes = routes.map(cloneRoute);
      routeEditHistories = routes.map(() => []);

      if (!routes.length) {
        editActionsElement.classList.add("hidden");
        showSearchView();
        setInteraction(activeRouteType() === "pointToPoint"
          ? (appState.points.end ? INTERACTION.READY_AB :
            (appState.points.start ? INTERACTION.PICK_B : INTERACTION.PICK_A))
          : INTERACTION.PICK_LOOP_START);
        const pointToPoint = activeRouteType() === "pointToPoint";
        const shortest = pointToPoint && activeAbPreference() === "shortest";
        setStatus(pointToPoint
          ? (shortest
            ? "Geen geschikte A→B-route gevonden. Kies andere punten A en B."
            : "Geen geschikte A→B-route gevonden. Kies andere punten of verruim afstand en tolerantie.")
          : (maxOverlap === 0
            ? "Geen rondje zonder overlap binnen de tolerantie gevonden. "
            : "Geen rondje binnen de tolerantie en maximaal 35% overlap gevonden. ") +
            "Probeer een grotere tolerantie, zoekstraal of afstand.", "error");
        return;
      }

      routes.forEach((route, index) => {
        const color = ROUTE_COLORS[index % ROUTE_COLORS.length];
        routeLayers.push(createRouteMapLayer(route, index));

        const card = document.createElement("button");
        card.type = "button";
        card.className = "route-card";
        card.dataset.routeIndex = String(index);
        card.style.setProperty("--route-color", color);
        card.innerHTML = routeCardMarkup(route, index);
        card.addEventListener("click", () => selectRoute(index));
        resultsElement.appendChild(card);
      });

      const pointToPoint = routes[0].routeType === "pointToPoint";
      const noun = pointToPoint
        ? (routes.length === 1 ? "route" : "routes")
        : (routes.length === 1 ? "rondje" : "rondjes");
      setStatus(
        `${routes.length} ${noun} gevonden. Klik op een resultaat om het te bekijken.`,
        "ready"
      );
      showResultsView(routes.length);
      selectRoute(0);
      setInteraction(INTERACTION.RESULTS);
    }

    function clearSelection(clearClick = true) {
      endEditMode();
      showSearchView();
      clearRouteLayers();
      resultsElement.innerHTML = "";
      currentRoutes = [];
      originalRoutes = [];
      routeEditHistories = [];
      editActionsElement.classList.add("hidden");
      if (clearClick) {
        if (searchMarker) map.removeLayer(searchMarker);
        if (endSearchMarker) map.removeLayer(endSearchMarker);
        searchMarker = null;
        endSearchMarker = null;
        appState.points.start = null;
        appState.points.end = null;
        setInteraction(activeRouteType() === "pointToPoint"
          ? INTERACTION.PICK_A
          : INTERACTION.PICK_LOOP_START);
      }
      if (appReady) {
        const pointToPoint = activeRouteType() === "pointToPoint";
        setStatus(clearClick
          ? (pointToPoint
            ? "Klik op de kaart om punt A te kiezen."
            : "Klik op de kaart om een zoekpunt te kiezen.")
          : (pointToPoint ? "Klaar om A→B-routes te zoeken." : "Klaar om rondjes te zoeken."),
        "ready");
      }
    }

    function renderSourceData(geojson) {
      const lineFeatures = [];
      geojson.features.forEach(feature => {
        if (!feature || !feature.geometry) return;
        if (["LineString", "MultiLineString"].includes(feature.geometry.type)) {
          lineFeatures.push(feature);
        }
      });

      networkLayer = L.geoJSON(
        { type: "FeatureCollection", features: lineFeatures },
        {
          style: {
            color: "#005db9",
            weight: 2.4,
            opacity: 0.92
          },
          interactive: false
        }
      ).addTo(map);

      const group = L.featureGroup([networkLayer]);
      if (group.getBounds().isValid()) {
        map.fitBounds(group.getBounds(), {
          padding: [25, 25],
          animate: false
        });
      }
      requestAnimationFrame(() => {
        map.invalidateSize({ animate: false });
        requestAnimationFrame(startBasemapLoading);
      });
    }

    async function loadNetwork() {
      setStatus("GeoJSON laden en analyseren…", "loading");
      searchButton.disabled = true;
      setInteraction(INTERACTION.SEARCHING);
      try {
        if (location.protocol === "file:") {
          throw new Error(
            "Deze pagina is rechtstreeks als bestand geopend. Open een terminal in de map " +
            "‘paden’, voer ‘python -m http.server 8000’ uit en open daarna " +
            "http://localhost:8000/."
          );
        }
        const response = await fetch("./Edge.geojson");
        if (!response.ok) {
          throw new Error(`GeoJSON kon niet worden geladen (HTTP ${response.status}).`);
        }
        const geojson = await response.json();
        const report = inspectGeoJson(geojson);
        const topologyReport = inspectEdgeTopology(geojson);
        normalizedData = normalizeGeoJson(geojson);
        renderSourceData(geojson);

        setStatus("FME-topologie in routenetwerk omzetten…", "loading");
        await new Promise(resolve => setTimeout(resolve, 30));
        baseGraph = buildGraph(normalizedData);
        computeCyclicCore(baseGraph);
        graph = cloneRoutingGraph(baseGraph);

        if (!graph.nodes.length || !graph.edges.length) {
          throw new Error("Er konden geen routeerbare lijnen uit het bestand worden opgebouwd.");
        }
        appReady = true;
        searchButton.disabled = false;
        setStatus(
          `Klaar: ${numberNL.format(graph.nodes.length)} knooppunten en ` +
          `${numberNL.format(graph.edges.length)} gerichte verbindingen. ` +
          (activeRouteType() === "pointToPoint"
            ? "Klik op de kaart om punt A te kiezen."
            : "Klik op de kaart om een zoekpunt te kiezen."),
          "ready"
        );
        console.log("Volledig inspectierapport:", report);
        console.log("FME-topologierapport:", topologyReport);
      } catch (error) {
        console.error("Fout bij het laden van het netwerk:", error);
        const serverHint = location.protocol === "file:" ? "" :
          " Controleer of de server is gestart in dezelfde map als index.html en Edge.geojson.";
        setStatus(`${error.message}${serverHint}`, "error");
        startBasemapLoading();
      }
    }

    function handleMapClick(event) {
      if (!appReady) return;
      switch (appState.interaction) {
        case INTERACTION.EDIT_SOURCE: {
          const route = currentRoutes[selectedRouteIndex];
          const edgeIndex = route
            ? findNearestRouteEdgeIndex(route, event.latlng, 35)
            : null;
          if (edgeIndex !== null) selectEditSource(edgeIndex, event.latlng);
          else editHintElement.textContent =
            "Tik dichter bij de gekleurde route om een onderdeel te kiezen.";
          return;
        }
        case INTERACTION.EDIT_TARGET: {
          const target = findNearestEditableBaseEdge(event.latlng, 35);
          if (target) {
            showEditTarget(target.baseId);
            previewRouteDetour(target);
          } else {
            editHintElement.textContent =
              "Tik dichter bij het pad waar de route langs moet lopen.";
          }
          return;
        }
        case INTERACTION.EDIT_PREVIEW:
        case INTERACTION.SEARCHING:
          return;
        case INTERACTION.PICK_A:
          clearSelection(false);
          appState.points.start = event.latlng;
          if (searchMarker) map.removeLayer(searchMarker);
          searchMarker = L.marker(event.latlng, {
            icon: L.divIcon({ className: "search-pin", html: "A", iconSize: [24, 24] }),
            zIndexOffset: 1100
          }).addTo(map).bindTooltip("Aangeklikt punt A");
          setInteraction(appState.points.end ? INTERACTION.READY_AB : INTERACTION.PICK_B);
          setStatus(appState.points.end
            ? "Punt A gewijzigd. Klik op ‘Zoek routes’."
            : "Punt A gekozen. Klik nu punt B op de kaart.", "ready");
          return;
        case INTERACTION.PICK_B:
          clearSelection(false);
          appState.points.end = event.latlng;
          if (endSearchMarker) map.removeLayer(endSearchMarker);
          endSearchMarker = L.marker(event.latlng, {
            icon: L.divIcon({ className: "end-search-pin", html: "B", iconSize: [24, 24] }),
            zIndexOffset: 1100
          }).addTo(map).bindTooltip("Aangeklikt punt B");
          setInteraction(INTERACTION.READY_AB);
          setStatus("Punten A en B gekozen. Klik op ‘Zoek routes’.", "ready");
          return;
        case INTERACTION.READY_AB:
          setStatus("Gebruik ‘A gekozen · wijzig’ of ‘B gekozen · wijzig’ om een punt te verplaatsen.", "ready");
          return;
        case INTERACTION.RESULTS:
          setStatus("Kies een resultaat of ga terug om nieuwe punten te kiezen.", "ready");
          return;
        case INTERACTION.PICK_LOOP_START:
        default:
          clearSelection(false);
          appState.points.start = event.latlng;
          if (searchMarker) map.removeLayer(searchMarker);
          searchMarker = L.marker(event.latlng, {
            icon: L.divIcon({ className: "search-pin", html: "", iconSize: [24, 24] }),
            zIndexOffset: 1100
          }).addTo(map).bindTooltip("Aangeklikt zoekpunt");
          setStatus("Zoekpunt gekozen. Stel de afstand in en klik op ‘Zoek rondjes’.", "ready");
      }
    }

    async function handleSearch() {
      endEditMode();
      showSearchView();
      if (!appReady) {
        setStatus("Het netwerk is nog niet gereed.", "error");
        return;
      }
      const routeType = activeRouteType();
      const pointToPoint = routeType === "pointToPoint";
      if (!appState.points.start || (pointToPoint && !appState.points.end)) {
        setStatus(pointToPoint
          ? "Klik eerst punt A en daarna punt B op de kaart."
          : "Klik eerst ergens op de kaart.", "error");
        return;
      }

      const preference = pointToPoint ? activeAbPreference() : "distance";
      const needsTargetDistance = !pointToPoint || preference === "distance";
      const targetDistance = Number(document.getElementById("distanceInput").value);
      const tolerancePercent = Number(document.getElementById("toleranceInput").value);
      const searchRadius = Number(document.getElementById("radiusInput").value);
      const maxResults = Number(document.getElementById("resultCountInput").value);
      const mode = pointToPoint
        ? "snap"
        : document.querySelector('input[name="startMode"]:checked').value;
      const maximumOverlap = document.getElementById("allowOverlapInput").checked
        ? CONFIG.maxOverlap
        : 0;
      if (needsTargetDistance && (!Number.isFinite(targetDistance) || targetDistance < 200)) {
        setStatus("Voer een doelafstand van minimaal 200 meter in.", "error");
        return;
      }
      if (needsTargetDistance && (!Number.isFinite(tolerancePercent) ||
          tolerancePercent < 1 || tolerancePercent > 80)) {
        setStatus("Voer een tolerantie tussen 1% en 80% in.", "error");
        return;
      }
      if (!pointToPoint && (!Number.isFinite(searchRadius) || searchRadius < 25)) {
        setStatus("Voer een zoekstraal van minimaal 25 meter in.", "error");
        return;
      }
      if (!Number.isInteger(maxResults) || maxResults < 1 || maxResults > CONFIG.maxResults) {
        setStatus(
          `Kies een maximaal aantal ${pointToPoint ? "routes" : "rondjes"} ` +
          `tussen 1 en ${CONFIG.maxResults}.`,
          "error"
        );
        return;
      }

      if (pointToPoint) {
        const clickDistance = turf.distance(
          [appState.points.start.lng, appState.points.start.lat],
          [appState.points.end.lng, appState.points.end.lat],
          { units: "meters" }
        );
        if (clickDistance < 10) {
          setStatus("Kies punten A en B minimaal 10 meter uit elkaar.", "error");
          return;
        }
      }

      searchButton.disabled = true;
      setInteraction(INTERACTION.SEARCHING);
      clearRouteLayers();
      resultsElement.innerHTML = "";
      currentRoutes = [];
      originalRoutes = [];
      routeEditHistories = [];
      setStatus(pointToPoint
        ? "Punten op het netwerk plaatsen en A→B-routes onderzoeken…"
        : "Kandidaat-startpunten en gesloten rondjes onderzoeken…", "loading");
      await new Promise(resolve => setTimeout(resolve, 30));

      try {
        resetRoutingGraph();
        if (pointToPoint) {
          const endpoints = preparePointToPointEndpoints(
            appState.points.start,
            appState.points.end
          );
          if (!endpoints) {
            displayRoutes([], maximumOverlap);
            return;
          }
          const tooFar = [endpoints.start, endpoints.end]
            .find(endpoint => endpoint.distance > CONFIG.maxPointSnapDistance);
          if (tooFar) {
            setStatus(
              `Punt ${tooFar === endpoints.start ? "A" : "B"} ligt meer dan ` +
              `${CONFIG.maxPointSnapDistance} meter van het routenetwerk. Kies een punt dichter bij een pad.`,
              "error"
            );
            return;
          }
          console.log("A→B-netwerkpunten:", endpoints);
          const routes = generatePointToPointRoutes(
            endpoints,
            preference,
            targetDistance,
            tolerancePercent / 100,
            maxResults,
            maximumOverlap
          );
          displayRoutes(routes, maximumOverlap);
          return;
        }

        const clickCoord = [appState.points.start.lng, appState.points.start.lat];
        let startCandidates;
        if (mode === "nearest") {
          const nearest = findNearestNode(clickCoord);
          startCandidates = nearest ? [{
            nodeId: nearest.nodeId,
            distance: nearest.distance,
            directions: nodeDirectionCount(nearest.nodeId)
          }] : [];
        } else {
          startCandidates = findCandidateStartNodes(clickCoord, searchRadius);
        }

        if (!startCandidates.length) {
          displayRoutes([], maximumOverlap);
          setStatus(
            mode === "auto"
              ? `Geen geschikt cyclisch startpunt binnen ${numberNL.format(searchRadius)} meter gevonden.`
              : "Geen netwerkpunt gevonden.",
            "error"
          );
          return;
        }

        console.log("Gebruikte kandidaat-startpunten:", startCandidates);
        const routes = generateLoops(
          startCandidates,
          targetDistance,
          tolerancePercent / 100,
          mode === "nearest" ? Math.max(searchRadius, startCandidates[0].distance, 1) : searchRadius,
          maxResults,
          maximumOverlap
        );
        displayRoutes(routes, maximumOverlap);
      } catch (error) {
        console.error("Fout tijdens het zoeken naar routes:", error);
        setStatus(`Zoeken mislukt: ${error.message}`, "error");
      } finally {
        searchButton.disabled = false;
        if (appState.interaction === INTERACTION.SEARCHING) {
          setInteraction(pointToPoint
            ? INTERACTION.READY_AB
            : INTERACTION.PICK_LOOP_START);
        }
      }
    }

    function initializeMap() {
      map = L.map("map", {
        zoomControl: false,
        preferCanvas: false,
        fadeAnimation: false,
        zoomAnimation: false,
        markerZoomAnimation: false
      }).setView([52.077, 5.178], 14);
      L.control.zoom({ position: "topright" }).addTo(map);

      let osmTileErrors = 0;
      const basemap = L.tileLayer(
        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          maxZoom: 19,
          keepBuffer: 3,
          updateWhenIdle: false,
          detectRetina: false,
          attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-bijdragers'
        }
      );
      basemap.on("tileerror", event => {
        osmTileErrors++;
        if (osmTileErrors === 1) {
          console.warn("Een OpenStreetMap-tile kon niet worden geladen:", event);
        }
        if (osmTileErrors >= 3) {
          mapWarningElement.textContent =
            "De OpenStreetMap-achtergrond wordt deels door de internetverbinding of firewall geblokkeerd.";
          mapWarningElement.classList.add("visible");
        }
      });
      let basemapHasStarted = false;
      startBasemapLoading = () => {
        if (basemapHasStarted) return;
        basemapHasStarted = true;
        basemap.addTo(map);
      };
      map.on("click", handleMapClick);
    }

    searchButton.addEventListener("click", handleSearch);
    clearButton.addEventListener("click", () => clearSelection(true));
    advancedToggle.addEventListener("click", () => {
      const expanded = formGridElement.classList.toggle("show-advanced");
      advancedToggle.setAttribute("aria-expanded", String(expanded));
      advancedToggle.textContent = expanded ? "Minder opties ▴" : "Meer opties ▾";
    });
    chooseAButton.addEventListener("click", () => {
      showSearchView();
      clearSelection(false);
      setInteraction(INTERACTION.PICK_A);
      setStatus("Klik op de kaart om punt A te kiezen.", "ready");
    });
    chooseBButton.addEventListener("click", () => {
      showSearchView();
      clearSelection(false);
      if (!appState.points.start) {
        setInteraction(INTERACTION.PICK_A);
        setStatus("Kies eerst punt A.", "error");
      } else {
        setInteraction(INTERACTION.PICK_B);
        setStatus("Klik op de kaart om punt B te kiezen.", "ready");
      }
    });
    document.querySelectorAll('input[name="routeType"]').forEach(input => {
      input.addEventListener("change", () => {
        updateInterfaceMode();
        clearSelection(true);
      });
    });
    document.querySelectorAll('input[name="abPreference"]').forEach(input => {
      input.addEventListener("change", () => {
        updateInterfaceMode();
        clearSelection(false);
        if (appState.points.start && appState.points.end) {
          setStatus("Punten A en B staan klaar. Klik op ‘Zoek routes’.", "ready");
        }
      });
    });
    editRouteButton.addEventListener("click", () => {
      if (isEditingRoute()) endEditMode();
      else beginEditMode();
    });
    confirmEditButton.addEventListener("click", confirmEditPreview);
    cancelEditButton.addEventListener("click", cancelEditPreview);
    undoEditButton.addEventListener("click", () => {
      const history = routeEditHistories[selectedRouteIndex] || [];
      if (!history.length) return;
      endEditMode();
      const previousRoute = history.pop();
      replaceDisplayedRoute(selectedRouteIndex, previousRoute, true);
      setStatus("Laatste routeaanpassing ongedaan gemaakt.", "ready");
    });
    resetEditButton.addEventListener("click", () => {
      const route = currentRoutes[selectedRouteIndex];
      const original = originalRoutes[selectedRouteIndex];
      if (!route || !original || routeSignature(route) === routeSignature(original)) return;
      endEditMode();
      routeEditHistories[selectedRouteIndex].push(cloneRoute(route));
      replaceDisplayedRoute(selectedRouteIndex, cloneRoute(original), true);
      setStatus("De oorspronkelijk gevonden route is hersteld.", "ready");
    });
    backButton.addEventListener("click", () => {
      endEditMode();
      showSearchView();
      setInteraction(activeRouteType() === "pointToPoint"
        ? (appState.points.end ? INTERACTION.READY_AB :
          (appState.points.start ? INTERACTION.PICK_B : INTERACTION.PICK_A))
        : INTERACTION.PICK_LOOP_START);
      setStatus(activeRouteType() === "pointToPoint"
        ? "Pas de routekeuze aan of kies nieuwe punten A en B."
        : "Pas de voorwaarden aan en zoek opnieuw.", "ready");
    });
    updateInterfaceMode();
    initializeMap();
    loadNetwork();
  </script>
</body>
</html>

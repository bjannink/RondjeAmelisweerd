<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rondje Amelisweerd</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQ3ynhOjRqgOZ7VCpN8fRW4ZJp4KZJc="
    crossorigin="">
  <style>
    /* Lokale Leaflet-CSS-fallback. Deze regels houden de kaart correct wanneer
       een browser of bedrijfsproxy de externe Leaflet-stylesheet niet toepast. */
    .leaflet-pane,
    .leaflet-tile,
    .leaflet-marker-icon,
    .leaflet-marker-shadow,
    .leaflet-tile-container,
    .leaflet-pane > svg,
    .leaflet-pane > canvas,
    .leaflet-zoom-box,
    .leaflet-image-layer,
    .leaflet-layer {
      position: absolute;
      left: 0;
      top: 0;
    }

    .leaflet-container {
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .leaflet-tile,
    .leaflet-marker-icon,
    .leaflet-marker-shadow {
      user-select: none;
      -webkit-user-drag: none;
    }

    .leaflet-tile {
      visibility: hidden;
      filter: inherit;
    }

    .leaflet-tile-loaded { visibility: inherit; }
    .leaflet-zoom-box { width: 0; height: 0; box-sizing: border-box; z-index: 800; }
    .leaflet-pane { z-index: 400; }
    .leaflet-tile-pane { z-index: 200; }
    .leaflet-overlay-pane { z-index: 400; }
    .leaflet-shadow-pane { z-index: 500; }
    .leaflet-marker-pane { z-index: 600; }
    .leaflet-tooltip-pane { z-index: 650; }
    .leaflet-popup-pane { z-index: 700; }
    .leaflet-map-pane canvas { z-index: 100; }
    .leaflet-map-pane svg { z-index: 200; }

    .leaflet-control {
      position: relative;
      z-index: 800;
      pointer-events: auto;
    }

    .leaflet-top,
    .leaflet-bottom {
      position: absolute;
      z-index: 1000;
      pointer-events: none;
    }

    .leaflet-top { top: 0; }
    .leaflet-right { right: 0; }
    .leaflet-bottom { bottom: 0; }
    .leaflet-left { left: 0; }
    .leaflet-control { float: left; clear: both; }
    .leaflet-right .leaflet-control { float: right; }
    .leaflet-top .leaflet-control { margin-top: 10px; }
    .leaflet-bottom .leaflet-control { margin-bottom: 10px; }
    .leaflet-left .leaflet-control { margin-left: 10px; }
    .leaflet-right .leaflet-control { margin-right: 10px; }

    :root {
      color-scheme: light;
      --ink: #1c1c1c;
      --muted: #636464;
      --paper: #f5f5f5;
      --panel: rgba(255, 255, 255, 0.97);
      --green: #005db9;
      --green-dark: #0b27a6;
      --green-soft: #eaf3f6;
      --line: #cddce8;
      --orange: #dd001c;
      --yellow: #ffde00;
      --shadow: 0 2px 8px rgba(0, 48, 105, 0.12);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Urbanist, "Open Sans", "Segoe UI", ui-sans-serif, system-ui,
        -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink);
      background: var(--green-soft);
    }

    button, input { font: inherit; }

    #map {
      position: absolute;
      inset: 0;
      background: var(--green-soft);
    }

    .leaflet-control-zoom a { color: var(--green-dark); }

    .app-panel {
      position: absolute;
      z-index: 1000;
      top: 12px;
      left: 12px;
      width: min(320px, calc(100vw - 24px));
      max-height: calc(100vh - 24px);
      overflow-y: auto;
      padding: 14px;
      border: 1px solid rgba(0, 93, 185, 0.16);
      border-top: 4px solid var(--green);
      border-radius: 0;
      background: var(--panel);
      box-shadow: var(--shadow);
      scrollbar-width: thin;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 34px;
      margin-bottom: 7px;
    }

    .ua-logo {
      display: block;
      width: min(165px, 66%);
      height: auto;
    }

    .brand-badge {
      flex: 0 0 auto;
      padding: 2px 0 2px 7px;
      border-left: 2px solid var(--orange);
      color: var(--green-dark);
      background: transparent;
      font-size: 0.56rem;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .eyebrow {
      margin: 0 0 3px;
      color: var(--orange);
      font-size: 0.62rem;
      font-weight: 850;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 1.52rem;
      font-weight: 900;
      line-height: 1.02;
      letter-spacing: -0.04em;
    }

    .intro {
      margin: 5px 0 10px;
      padding-bottom: 9px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.35;
    }

    .form-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 8px;
    }

    .field {
      display: flex;
      flex-direction: column;
      min-width: 0;
      gap: 3px;
    }

    .field.full { grid-column: 1 / -1; }

    .form-grid:not(.show-advanced) .advanced-field { display: none; }

    .advanced-toggle {
      width: 100%;
      min-height: 30px;
      margin-top: 7px;
      border: 1px solid var(--line);
      color: var(--green-dark);
      background: #fff;
      font-size: 0.68rem;
      text-align: left;
      padding: 0 8px;
    }

    .point-steps {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      grid-column: 1 / -1;
    }

    .point-step {
      min-height: 34px;
      padding: 5px 7px;
      border: 1px solid #bfd0df;
      color: #43566a;
      background: #fff;
      font-size: 0.68rem;
      font-weight: 750;
      text-align: left;
    }

    .point-step.active {
      border-color: var(--orange);
      box-shadow: inset 3px 0 0 var(--orange);
    }

    .point-step.complete {
      border-color: var(--green);
      color: var(--green-dark);
      background: var(--green-soft);
    }

    label, .field-label {
      color: #293f56;
      font-size: 0.68rem;
      font-weight: 750;
    }

    .input-wrap {
      position: relative;
      min-width: 0;
    }

    input[type="number"] {
      width: 100%;
      height: 35px;
      padding: 0 42px 0 9px;
      border: 1px solid #bfd0df;
      border-radius: 0;
      outline: none;
      color: var(--ink);
      background: #fff;
      font-size: 0.82rem;
      transition: border-color 150ms, box-shadow 150ms;
    }

    .input-wrap.no-suffix input { padding-right: 9px; }

    input[type="number"]:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(0, 93, 185, 0.13);
    }

    .suffix {
      position: absolute;
      top: 50%;
      right: 9px;
      color: #71808d;
      font-size: 0.68rem;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .mode-options {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 5px;
    }

    .route-type-options .radio-card span { min-height: 32px; }

    .radio-card { position: relative; }
    .radio-card input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .radio-card span {
      display: flex;
      min-height: 38px;
      align-items: center;
      justify-content: center;
      padding: 5px 6px;
      border: 1px solid #bfd0df;
      border-radius: 0;
      color: #43566a;
      background: #fff;
      font-size: 0.69rem;
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
      cursor: pointer;
    }

    .radio-card input:checked + span {
      border-color: var(--green);
      color: var(--green-dark);
      background: var(--green-soft);
      box-shadow: inset 0 0 0 1px var(--green);
    }

    .check-option {
      display: flex;
      min-height: 30px;
      align-items: center;
      gap: 7px;
      padding: 4px 8px;
      border: 1px solid #bfd0df;
      color: #293f56;
      background: #fff;
      cursor: pointer;
    }

    .check-option input {
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: var(--green);
    }

    .check-option small {
      color: var(--muted);
      font-size: 0.64rem;
      font-weight: 600;
    }

    .actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      margin-top: 9px;
    }

    button {
      min-height: 36px;
      border: 0;
      border-radius: 0;
      font-weight: 800;
      font-size: 0.79rem;
      cursor: pointer;
      transition: transform 120ms, opacity 120ms, background 120ms;
    }

    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled { cursor: wait; opacity: 0.58; }

    #searchButton {
      padding: 0 13px;
      color: white;
      background: var(--orange);
    }

    #searchButton:hover:not(:disabled) { background: #b90018; }

    #clearButton {
      padding: 0 10px;
      color: var(--green-dark);
      background: var(--green-soft);
    }

    .status {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin-top: 8px;
      padding: 7px 8px;
      border-left: 3px solid var(--green);
      border-radius: 0;
      color: #405b72;
      background: #edf5f8;
      font-size: 0.68rem;
      line-height: 1.3;
    }

    .status::before {
      flex: 0 0 auto;
      width: 7px;
      height: 7px;
      margin-top: 2px;
      border-radius: 50%;
      background: #7892a8;
      content: "";
    }

    .status.loading::before {
      border: 2px solid #a9b8ad;
      border-top-color: var(--green);
      background: transparent;
      animation: spin 0.8s linear infinite;
    }

    .status.ready::before { background: var(--green); }
    .status.error { color: #8c2e25; background: #f9e9e6; }
    .status.error::before { background: #c74c3e; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .results {
      display: grid;
      gap: 6px;
      margin-top: 8px;
    }

    .mobile-results-header { display: none; }

    .results-heading {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 850;
    }

    .results-summary {
      display: block;
      margin-top: 1px;
      color: var(--muted);
      font-size: 0.66rem;
    }

    #backButton {
      min-height: 30px;
      padding: 0 9px;
      border: 1px solid var(--green);
      color: var(--green-dark);
      background: #fff;
      font-size: 0.7rem;
    }

    .hidden { display: none !important; }

    .edit-actions {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 4px;
      margin-top: 6px;
    }

    .edit-actions.previewing {
      grid-template-columns: 1fr 1fr;
    }

    .edit-actions.previewing .normal-edit-action { display: none; }
    .edit-actions:not(.previewing) .preview-edit-action { display: none; }

    #confirmEditButton {
      border-color: var(--green-dark);
      color: #fff;
      background: var(--green);
    }

    .edit-actions button {
      min-height: 30px;
      padding: 0 8px;
      border: 1px solid var(--line);
      color: var(--ink);
      background: #fff;
      font-size: 0.68rem;
    }

    .edit-actions button:disabled {
      color: #87939d;
      background: #eef1f2;
      cursor: default;
    }

    #editRouteButton.active {
      border-color: var(--green-dark);
      color: #fff;
      background: var(--green);
    }

    .edit-hint {
      margin-top: 5px;
      padding: 5px 7px;
      border-left: 3px solid var(--orange);
      color: #4e5962;
      background: #fff5ed;
      font-size: 0.66rem;
      line-height: 1.3;
    }

    .edit-handle {
      width: 16px;
      height: 16px;
      border: 3px solid #fff;
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.55);
    }

    .route-card {
      width: 100%;
      min-height: 0;
      padding: 8px 9px;
      border: 1px solid var(--line);
      border-left: 5px solid var(--route-color);
      border-radius: 0;
      color: var(--ink);
      background: #fff;
      text-align: left;
      box-shadow: none;
    }

    .route-card.selected {
      border-color: color-mix(in srgb, var(--route-color), #fff 30%);
      background: #f8fbfd;
      outline: 2px solid color-mix(in srgb, var(--route-color), transparent 72%);
      outline-offset: -1px;
    }

    .route-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 0.78rem;
      font-weight: 850;
    }

    .route-distance {
      color: var(--route-color);
      font-size: 0.73rem;
    }

    .route-meta {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 2px 8px;
      color: var(--muted);
      font-size: 0.67rem;
      font-weight: 600;
      line-height: 1.35;
    }

    .route-meta .wide { grid-column: 1 / -1; }

    .map-key {
      position: absolute;
      z-index: 900;
      right: 13px;
      bottom: 22px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 0;
      color: #40566a;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 2px 6px rgba(0, 48, 105, 0.1);
      font-size: 0.71rem;
      line-height: 1.65;
    }

    .map-warning {
      position: absolute;
      z-index: 900;
      top: 82px;
      right: 12px;
      display: none;
      width: min(290px, calc(100vw - 24px));
      padding: 9px 11px;
      border: 1px solid #e7c986;
      border-radius: 0;
      color: #6d4c0d;
      background: rgba(255, 247, 224, 0.95);
      box-shadow: 0 5px 18px rgba(55, 42, 15, 0.13);
      font-size: 0.73rem;
      line-height: 1.4;
    }

    .map-warning.visible { display: block; }

    .key-row { display: flex; align-items: center; gap: 7px; }
    .key-line { width: 20px; border-top: 3px solid var(--green); }
    .key-area { width: 20px; height: 9px; border: 1px solid var(--green); background: rgba(88, 144, 219, 0.16); }
    .key-click { width: 9px; height: 9px; border: 2px solid #fff; border-radius: 50%; background: var(--orange); box-shadow: 0 0 0 1px var(--orange); }

    .search-pin, .start-pin, .end-search-pin, .end-pin {
      display: grid;
      width: 24px !important;
      height: 24px !important;
      margin: -12px 0 0 -12px !important;
      place-items: center;
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .search-pin, .end-search-pin {
      color: #fff;
      font-size: 0.67rem;
      font-weight: 900;
      line-height: 1;
    }

    .search-pin { background: var(--orange); }
    .start-pin { background: var(--green); }
    .end-search-pin { background: #005db9; }
    .end-pin { background: #243f59; }
    .waypoint-pin {
      width: 14px !important;
      height: 14px !important;
      margin: -7px 0 0 -7px !important;
      border: 2px solid #fff;
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
    }

    @media (max-width: 640px) {
      .app-panel {
        top: auto;
        bottom: 6px;
        left: 6px;
        width: calc(100vw - 12px);
        max-height: 44vh;
        padding: 10px;
        border-radius: 0;
      }

      .brand-row {
        min-height: 24px;
        margin-bottom: 2px;
      }

      .ua-logo { width: min(118px, 55%); }
      .brand-badge, .eyebrow { display: none; }
      .intro { display: none; }
      h1 { margin-bottom: 6px; font-size: 1.18rem; }

      .app-panel:not(.results-mode) .results-view { display: none; }

      .app-panel.results-mode {
        max-height: 44vh;
        padding: 8px;
      }

      .app-panel.results-mode > .brand-row,
      .app-panel.results-mode > .eyebrow,
      .app-panel.results-mode > h1,
      .app-panel.results-mode > .search-view {
        display: none;
      }

      .mobile-results-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--line);
      }

      .app-panel.results-mode .results { margin-top: 6px; }
      .app-panel.results-mode .edit-actions { margin-top: 5px; }
      .app-panel.results-mode .route-card:not(.selected) .route-meta { display: none; }
      .app-panel.results-mode .route-card { padding: 6px 8px; }
      .map-key { display: none; }
      .map-warning { top: 76px; }
      .leaflet-control-attribution { max-width: 55vw; font-size: 9px; }
    }

    .app-panel.editing-route .route-card:not(.selected) {
      display: none;
    }
  </style>
</head>

    function isEditingRoute() {
      return [
        INTERACTION.EDIT_SOURCE,
        INTERACTION.EDIT_TARGET,
        INTERACTION.EDIT_PREVIEW
      ].includes(appState.interaction);
    }

    function updatePointStepDisplay() {
      const pointToPoint = activeRouteType() === "pointToPoint";
      pointToPointSteps.classList.toggle("hidden", !pointToPoint);
      if (!pointToPoint) return;
      const hasA = Boolean(appState.points.start);
      const hasB = Boolean(appState.points.end);
      chooseAButton.classList.toggle("complete", hasA);
      chooseBButton.classList.toggle("complete", hasB);
      chooseAButton.classList.toggle("active", appState.interaction === INTERACTION.PICK_A);
      chooseBButton.classList.toggle("active", appState.interaction === INTERACTION.PICK_B);
      chooseAButton.textContent = hasA ? "A gekozen · wijzig" : "1. Kies A";
      chooseBButton.textContent = hasB ? "B gekozen · wijzig" : "2. Kies B";
    }

    function setInteraction(nextInteraction) {
      appState.interaction = nextInteraction;
      updatePointStepDisplay();
    }

    function activeRouteType() {
      return document.querySelector('input[name="routeType"]:checked').value;
    }

    function activeAbPreference() {
      return document.querySelector('input[name="abPreference"]:checked').value;
    }

    function updateInterfaceMode() {
      const pointToPoint = activeRouteType() === "pointToPoint";
      const useDesiredDistance = pointToPoint && activeAbPreference() === "distance";
      abPreferenceField.classList.toggle("hidden", !pointToPoint);
      startModeField.classList.toggle("hidden", pointToPoint);
      radiusField.classList.toggle("hidden", pointToPoint);
      distanceField.classList.toggle("hidden", pointToPoint && !useDesiredDistance);
      toleranceField.classList.toggle("hidden", pointToPoint && !useDesiredDistance);
      pageTitleElement.textContent = pointToPoint
        ? "Route door Amelisweerd"
        : "Rondje Amelisweerd";
      introTextElement.textContent = pointToPoint
        ? "Klik eerst punt A en daarna punt B op de kaart."
        : "Kies je start, stel je afstand in en vind een trainingsronde die bij je past.";
      searchButton.textContent = pointToPoint ? "Zoek routes" : "Zoek rondjes";
      resultCountLabel.textContent = pointToPoint
        ? "Maximaal aantal routes"
        : "Maximaal aantal rondjes";
      resultsHeadingElement.textContent = pointToPoint
        ? "Gevonden routes"
        : "Gevonden rondjes";
      updatePointStepDisplay();
    }

    function setStatus(message, type = "") {
      statusElement.textContent = message;
      statusElement.className = `status ${type}`.trim();
    }

    function showSearchView() {
      appPanel.classList.remove("results-mode");
      appPanel.scrollTop = 0;
    }

    function showResultsView(routeCount) {
      const noun = activeRouteType() === "pointToPoint"
        ? (routeCount === 1 ? "route" : "routes")
        : (routeCount === 1 ? "rondje" : "rondjes");
      resultsSummaryElement.textContent =
        `${routeCount} ${noun} — tik om te selecteren`;
      appPanel.classList.add("results-mode");
      appPanel.scrollTop = 0;
    }

    function validCoordinate(coord) {
      return Array.isArray(coord) &&
        coord.length >= 2 &&
        Number.isFinite(Number(coord[0])) &&
        Number.isFinite(Number(coord[1])) &&
        Number(coord[0]) >= -180 &&
        Number(coord[0]) <= 180 &&
        Number(coord[1]) >= -90 &&
        Number(coord[1]) <= 90;
    }

    function hasValidLine(coords) {
      return Array.isArray(coords) && coords.length >= 2 && coords.every(validCoordinate);
    }

    function hasValidPolygon(coords) {
      return Array.isArray(coords) &&
        coords.length > 0 &&
        coords.every(ring =>
          Array.isArray(ring) &&
          ring.length >= 4 &&
          ring.every(validCoordinate)
        );
    }

    function inspectGeoJson(geojson) {
      const counts = {
        LineString: 0,
        MultiLineString: 0,
        Polygon: 0,
        MultiPolygon: 0
      };
      const propertyNames = new Set();
      const invalidFeatures = [];
      const features = geojson && geojson.type === "FeatureCollection" &&
        Array.isArray(geojson.features) ? geojson.features : [];

      features.forEach((feature, index) => {
        Object.keys(feature && feature.properties ? feature.properties : {})
          .forEach(name => propertyNames.add(name));

        const geometry = feature && feature.geometry;
        if (!geometry || typeof geometry.type !== "string" || !Array.isArray(geometry.coordinates)) {
          invalidFeatures.push({ index, reden: "ontbrekende of ongeldige geometrie" });
          return;
        }

        if (Object.prototype.hasOwnProperty.call(counts, geometry.type)) {
          counts[geometry.type]++;
        }

        let valid = false;
        if (geometry.type === "LineString") {
          valid = hasValidLine(geometry.coordinates);
        } else if (geometry.type === "MultiLineString") {
          valid = geometry.coordinates.length > 0 && geometry.coordinates.every(hasValidLine);
        } else if (geometry.type === "Polygon") {
          valid = hasValidPolygon(geometry.coordinates);
        } else if (geometry.type === "MultiPolygon") {
          valid = geometry.coordinates.length > 0 && geometry.coordinates.every(hasValidPolygon);
        }

        if (!valid) {
          invalidFeatures.push({
            index,
            type: geometry.type,
            reden: "ongeldige coördinaten of niet-ondersteund geometrietype"
          });
        }
      });

      const report = {
        totalFeatures: features.length,
        lineStrings: counts.LineString,
        multiLineStrings: counts.MultiLineString,
        polygons: counts.Polygon,
        multiPolygons: counts.MultiPolygon,
        propertyNames: [...propertyNames].sort(),
        invalidFeatures
      };

      console.group("Analyse Edge.geojson");
      console.log("Totaal aantal features:", report.totalFeatures);
      console.log("Aantal LineStrings:", report.lineStrings);
      console.log("Aantal MultiLineStrings:", report.multiLineStrings);
      console.log("Aantal Polygons:", report.polygons);
      console.log("Aantal MultiPolygons:", report.multiPolygons);
      console.log("Aangetroffen propertynamen:", report.propertyNames);
      console.log("Features met ontbrekende of ongeldige geometrie:", report.invalidFeatures);
      console.groupEnd();

      if (!geojson || geojson.type !== "FeatureCollection" || !Array.isArray(geojson.features)) {
        throw new Error("Het GeoJSON-bestand is geen geldige FeatureCollection.");
      }
      return report;
    }

    function inspectEdgeTopology(geojson) {
      const edgeIds = new Set();
      const nodeCoordinates = new Map();
      const endpointByCoordinate = new Map();
      const errors = [];

      const registerNode = (nodeId, coord, edgeId, role) => {
        if (nodeId === undefined || nodeId === null || !validCoordinate(coord)) {
          errors.push({ edgeId, role, reason: "node-ID of coördinaat ontbreekt" });
          return;
        }
        const key = coordinateKey(coord);
        if (nodeCoordinates.has(nodeId) && nodeCoordinates.get(nodeId) !== key) {
          errors.push({ edgeId, role, nodeId, reason: "node-ID heeft meerdere coördinaten" });
          return;
        }
        nodeCoordinates.set(nodeId, key);
        endpointByCoordinate.set(key, nodeId);
      };

      geojson.features.forEach((feature, featureIndex) => {
        const properties = feature && feature.properties ? feature.properties : {};
        const coordinates = feature && feature.geometry && feature.geometry.coordinates;
        const edgeId = properties._edge_id;
        if (edgeId === undefined || edgeId === null) {
          errors.push({ featureIndex, reason: "_edge_id ontbreekt" });
        } else if (edgeIds.has(edgeId)) {
          errors.push({ featureIndex, edgeId, reason: "dubbele _edge_id" });
        } else {
          edgeIds.add(edgeId);
        }
        if (feature && feature.geometry && feature.geometry.type === "LineString" &&
            Array.isArray(coordinates) && coordinates.length >= 2) {
          registerNode(properties._from_node, coordinates[0], edgeId, "from");
          registerNode(properties._to_node, coordinates[coordinates.length - 1], edgeId, "to");
        }
      });

      let internalNodeOccurrences = 0;
      const internalNodeIds = new Set();
      geojson.features.forEach(feature => {
        if (!feature || !feature.geometry || feature.geometry.type !== "LineString") return;
        const coordinates = feature.geometry.coordinates;
        for (let index = 1; index < coordinates.length - 1; index++) {
          const nodeId = endpointByCoordinate.get(coordinateKey(coordinates[index]));
          if (nodeId !== undefined) {
            internalNodeOccurrences++;
            internalNodeIds.add(nodeId);
          }
        }
      });

      const report = {
        edges: edgeIds.size,
        derivedNodes: nodeCoordinates.size,
        internalNodeOccurrences,
        internalNodes: internalNodeIds.size,
        errors
      };
      console.group("Controle FME-edge-topologie");
      console.log("Unieke edges:", report.edges);
      console.log("Uit eindpunten afgeleide nodes:", report.derivedNodes);
      console.log(
        "Nodecoördinaten die als intern vormpunt op een andere edge liggen:",
        report.internalNodes
      );
      if (report.internalNodes) {
        console.warn(
          "Deze punten worden niet automatisch verbonden; alleen _from_node en _to_node bepalen de graaf."
        );
      }
      console.log("Topologiefouten:", report.errors);
      console.groupEnd();
      if (errors.length) {
        throw new Error(`Edge.geojson bevat ${errors.length} topologiefout(en).`);
      }
      return report;
    }

    function normalizeGeoJson(geojson) {
      const lines = [];
      const unsupported = [];

      geojson.features.forEach((feature, featureIndex) => {
        if (!feature || !feature.geometry) return;
        const geometry = feature.geometry;
        const properties = { ...(feature.properties || {}) };

        if (geometry.type === "LineString" && hasValidLine(geometry.coordinates)) {
          lines.push({
            id: properties._edge_id === undefined
              ? `line-${featureIndex}`
              : `edge-${properties._edge_id}`,
            sourceFeatureIndex: featureIndex,
            coordinates: geometry.coordinates.map(c => [Number(c[0]), Number(c[1])]),
            properties
          });
        } else if (geometry.type === "MultiLineString" && Array.isArray(geometry.coordinates)) {
          geometry.coordinates.forEach((coords, partIndex) => {
            if (!hasValidLine(coords)) return;
            lines.push({
              id: `line-${featureIndex}-${partIndex}`,
              sourceFeatureIndex: featureIndex,
              coordinates: coords.map(c => [Number(c[0]), Number(c[1])]),
              properties
            });
          });
        } else {
          unsupported.push({ featureIndex, type: geometry.type });
        }
      });

      console.log(
        `Normalisatie: ${lines.length} lijnobjecten.`
      );
      if (unsupported.length) {
        console.warn("Niet bruikbare features zijn overgeslagen:", unsupported);
      }
      return { lines, unsupported };
    }

    function propertyValue(properties, ...names) {
      for (const name of names) {
        if (properties && properties[name] !== undefined && properties[name] !== null) {
          return String(properties[name]).trim().toLowerCase();
        }
      }
      return "";
    }

    function coordinateKey(coord, precision = 8) {
      return `${Number(coord[0]).toFixed(precision)},${Number(coord[1]).toFixed(precision)}`;
    }

    function createEmptyGraph(referenceLatitude) {
      return {
        nodes: [],
        adjacency: [],
        edges: [],
        baseEdges: [],
        nodeGrid: new Map(),
        referenceLatitude,
        cyclicCore: new Set()
      };
    }

    function cloneRoutingGraph(source) {
      const cloned = createEmptyGraph(source.referenceLatitude);
      cloned.nodes = source.nodes.map(node => ({
        ...node,
        coord: [...node.coord]
      }));
      cloned.adjacency = cloned.nodes.map(() => []);
      cloned.baseEdges = source.baseEdges.map(base => ({
        ...base,
        coordinates: base.coordinates.map(coord => [...coord]),
        properties: { ...(base.properties || {}) }
      }));
      cloned.edges = source.edges.map(edge => ({
        ...edge,
        properties: { ...(edge.properties || {}) }
      }));
      cloned.edges.forEach(edge => cloned.adjacency[edge.from].push(edge));
      cloned.cyclicCore = new Set(source.cyclicCore);
      return cloned;
    }

    function walkingDirection(properties) {
      const foot = propertyValue(properties, "foot");
      const access = propertyValue(properties, "access");
      if (["no", "private"].includes(foot)) return { allowed: false };
      if (["no", "private"].includes(access) && !["yes", "designated", "permissive"].includes(foot)) {
        return { allowed: false };
      }

      const explicitFootOneway = propertyValue(
        properties,
        "oneway:foot",
        "foot:oneway",
        "oneway_foot"
      );
      const genericOneway = propertyValue(properties, "oneway");
      const direction = explicitFootOneway || genericOneway;
      let forward = true;
      let backward = true;
      if (["yes", "true", "1"].includes(direction)) backward = false;
      if (["-1", "reverse"].includes(direction)) forward = false;
      if (["no", "false", "0"].includes(direction)) {
        forward = true;
        backward = true;
      }
      if (propertyValue(properties, "foot:forward") === "no") forward = false;
      if (propertyValue(properties, "foot:backward") === "no") backward = false;
      return { allowed: forward || backward, forward, backward };
    }

    function addDirectedEdge(targetGraph, from, to, length, baseId, options = {}) {
      if (from === to || !Number.isFinite(length) || length <= 0) return null;
      const edge = {
        id: targetGraph.edges.length,
        from,
        to,
        length,
        baseId,
        reversed: Boolean(options.reversed),
        virtual: Boolean(options.virtual),
        properties: options.properties || {}
      };
      targetGraph.edges.push(edge);
      targetGraph.adjacency[from].push(edge);
      return edge.id;
    }

    function addGraphConnection(targetGraph, from, to, options = {}) {
      if (from === to) return null;
      const start = targetGraph.nodes[from].coord;
      const end = targetGraph.nodes[to].coord;
      const length = options.length ||
        turf.distance(start, end, { units: "meters" });
      if (length < 0.05) return null;
      const coordinates = Array.isArray(options.coordinates) && options.coordinates.length >= 2
        ? options.coordinates.map(coord => [Number(coord[0]), Number(coord[1])])
        : [start, end];

      const baseId = targetGraph.baseEdges.length;
      targetGraph.baseEdges.push({
        id: baseId,
        from,
        to,
        length,
        coordinates,
        virtual: Boolean(options.virtual),
        properties: options.properties || {}
      });

      if (options.forward !== false) {
        addDirectedEdge(targetGraph, from, to, length, baseId, {
          ...options,
          reversed: false
        });
      }
      if (options.backward !== false) {
        addDirectedEdge(targetGraph, to, from, length, baseId, {
          ...options,
          reversed: true
        });
      }
      return baseId;
    }

    function buildGraph(normalized) {
      const allCoords = normalized.lines.flatMap(line => line.coordinates);
      const referenceLatitude = allCoords.length
        ? allCoords.reduce((sum, coord) => sum + coord[1], 0) / allCoords.length
        : 52.08;
      const targetGraph = createEmptyGraph(referenceLatitude);
      const topologyNodes = new Map();

      const topologyNode = (sourceNodeId, coord) => {
        if (sourceNodeId === undefined || sourceNodeId === null) {
          throw new Error("Een edge bevat geen geldige _from_node of _to_node.");
        }
        if (topologyNodes.has(sourceNodeId)) {
          const nodeId = topologyNodes.get(sourceNodeId);
          const distance = turf.distance(targetGraph.nodes[nodeId].coord, coord, {
            units: "meters"
          });
          if (distance > 0.05) {
            throw new Error(`Node ${sourceNodeId} heeft meerdere coördinaten.`);
          }
          return nodeId;
        }
        const nodeId = targetGraph.nodes.length;
        targetGraph.nodes.push({
          id: nodeId,
          sourceNodeId,
          coord: [Number(coord[0]), Number(coord[1])]
        });
        targetGraph.adjacency.push([]);
        topologyNodes.set(sourceNodeId, nodeId);
        return nodeId;
      };

      normalized.lines.forEach(line => {
        const properties = line.properties || {};
        const direction = walkingDirection(properties);
        if (!direction.allowed) return;
        const from = topologyNode(properties._from_node, line.coordinates[0]);
        const to = topologyNode(
          properties._to_node,
          line.coordinates[line.coordinates.length - 1]
        );
        const length = turf.length(turf.lineString(line.coordinates), {
          units: "kilometers"
        }) * 1000;
        addGraphConnection(targetGraph, from, to, {
          length,
          coordinates: line.coordinates,
          properties,
          virtual: false,
          forward: direction.forward,
          backward: direction.backward
        });
      });

      console.log(
        `FME-topologiegraaf: ${targetGraph.nodes.length} knooppunten, ` +
        `${targetGraph.baseEdges.length} edges en ` +
        `${targetGraph.edges.length} gerichte edges.`
      );
      return targetGraph;
    }

    function computeCyclicCore(targetGraph) {
      const neighbors = targetGraph.nodes.map((_, nodeId) =>
        new Set(targetGraph.adjacency[nodeId].map(edge => edge.to))
      );
      const degree = neighbors.map(set => set.size);
      const removed = new Array(targetGraph.nodes.length).fill(false);
      const queue = [];
      degree.forEach((value, nodeId) => {
        if (value < 2) queue.push(nodeId);
      });

      for (let cursor = 0; cursor < queue.length; cursor++) {
        const nodeId = queue[cursor];
        if (removed[nodeId]) continue;
        removed[nodeId] = true;
        neighbors[nodeId].forEach(neighbor => {
          if (!removed[neighbor]) {
            degree[neighbor]--;
            if (degree[neighbor] < 2) queue.push(neighbor);
          }
        });
      }

      targetGraph.cyclicCore = new Set(
        targetGraph.nodes.map(node => node.id).filter(id => !removed[id])
      );
      console.log(
        `${targetGraph.cyclicCore.size} knooppunten liggen in het cyclische deel van het netwerk.`
      );
    }

    function findNearestNode(coordOrLatLng) {
      if (!graph || !graph.nodes.length) return null;
      const coord = Array.isArray(coordOrLatLng)
        ? coordOrLatLng
        : [coordOrLatLng.lng, coordOrLatLng.lat];
      let best = null;
      graph.nodes.forEach(node => {
        const distance = turf.distance(coord, node.coord, { units: "meters" });
        if (!best || distance < best.distance) best = { nodeId: node.id, distance };
      });
      return best;
    }

    function resetRoutingGraph() {
      if (!baseGraph) throw new Error("De basisgraaf is nog niet beschikbaar.");
      graph = cloneRoutingGraph(baseGraph);
    }

    function findNearestBasePosition(coordOrLatLng) {
      const coord = Array.isArray(coordOrLatLng)
        ? coordOrLatLng
        : [coordOrLatLng.lng, coordOrLatLng.lat];
      const point = turf.point(coord);
      let nearest = null;
      graph.baseEdges.forEach(base => {
        if (base.virtual || base.coordinates.length < 2) return;
        const snapped = turf.nearestPointOnLine(
          turf.lineString(base.coordinates),
          point,
          { units: "meters" }
        );
        const distance = Number(snapped.properties.dist);
        if (!Number.isFinite(distance) || (nearest && distance >= nearest.distance)) return;
        nearest = {
          baseId: base.id,
          coord: snapped.geometry.coordinates.map(Number),
          distance,
          location: Number(snapped.properties.location) || 0,
          index: Math.max(0, Math.min(
            base.coordinates.length - 2,
            Number(snapped.properties.index) || 0
          )),
          nodeId: null
        };
      });
      return nearest;
    }

    function addTemporaryNode(coord) {
      const node = {
        id: graph.nodes.length,
        coord: [Number(coord[0]), Number(coord[1])],
        virtual: true
      };
      graph.nodes.push(node);
      graph.adjacency.push([]);
      return node.id;
    }

    function pushCoordinate(target, coord) {
      const numeric = [Number(coord[0]), Number(coord[1])];
      const previous = target[target.length - 1];
      if (!previous || Math.abs(previous[0] - numeric[0]) > 1e-12 ||
          Math.abs(previous[1] - numeric[1]) > 1e-12) {
        target.push(numeric);
      }
    }

    function coordinatesBetweenPositions(base, fromPosition, toPosition) {
      const coordinates = [];
      pushCoordinate(coordinates, fromPosition.coord);
      for (let index = fromPosition.index + 1;
        index <= toPosition.index && index < base.coordinates.length;
        index++) {
        pushCoordinate(coordinates, base.coordinates[index]);
      }
      pushCoordinate(coordinates, toPosition.coord);
      return coordinates;
    }

    function preparePointToPointEndpoints(startLatLng, endLatLng) {
      const start = findNearestBasePosition(startLatLng);
      const end = findNearestBasePosition(endLatLng);
      if (!start || !end) return null;

      const positionsByBase = new Map();
      [{ ...start, key: "start" }, { ...end, key: "end" }].forEach(position => {
        if (!positionsByBase.has(position.baseId)) positionsByBase.set(position.baseId, []);
        positionsByBase.get(position.baseId).push(position);
      });
      const resolved = {};

      positionsByBase.forEach((positions, baseId) => {
        const base = graph.baseEdges[baseId];
        const forwardAllowed = graph.adjacency[base.from].some(edge =>
          !edge.disabled && edge.baseId === baseId && edge.to === base.to
        );
        const backwardAllowed = graph.adjacency[base.to].some(edge =>
          !edge.disabled && edge.baseId === baseId && edge.to === base.from
        );
        positions.sort((a, b) => a.location - b.location);

        positions.forEach((position, index) => {
          if (position.location <= 0.2) position.nodeId = base.from;
          else if (base.length - position.location <= 0.2) position.nodeId = base.to;
          else if (index > 0 &&
              Math.abs(position.location - positions[index - 1].location) <= 0.2) {
            position.nodeId = positions[index - 1].nodeId;
          } else {
            position.nodeId = addTemporaryNode(position.coord);
          }
          resolved[position.key] = position;
        });

        const interior = positions.filter(position =>
          position.nodeId !== base.from && position.nodeId !== base.to
        );
        if (!interior.length) return;
        graph.edges.forEach(edge => {
          if (edge.baseId === baseId) edge.disabled = true;
        });

        const boundaries = [
          { coord: base.coordinates[0], index: -1, location: 0, nodeId: base.from },
          ...positions.filter((position, index) =>
            position.nodeId !== base.from &&
            position.nodeId !== base.to &&
            (index === 0 || position.nodeId !== positions[index - 1].nodeId)
          ),
          {
            coord: base.coordinates[base.coordinates.length - 1],
            index: base.coordinates.length - 1,
            location: base.length,
            nodeId: base.to
          }
        ];
        for (let index = 1; index < boundaries.length; index++) {
          const fromPosition = boundaries[index - 1];
          const toPosition = boundaries[index];
          if (fromPosition.nodeId === toPosition.nodeId) continue;
          const coordinates = coordinatesBetweenPositions(base, fromPosition, toPosition);
          const length = turf.length(turf.lineString(coordinates), { units: "kilometers" }) * 1000;
          addGraphConnection(graph, fromPosition.nodeId, toPosition.nodeId, {
            length,
            coordinates,
            properties: { ...base.properties, temporary_snap: true },
            virtual: true,
            forward: forwardAllowed,
            backward: backwardAllowed
          });
        }
      });

      return {
        start: {
          nodeId: resolved.start.nodeId,
          coord: resolved.start.coord,
          distance: resolved.start.distance,
          baseId: resolved.start.baseId
        },
        end: {
          nodeId: resolved.end.nodeId,
          coord: resolved.end.coord,
          distance: resolved.end.distance,
          baseId: resolved.end.baseId
        }
      };
    }

    function nodeDirectionCount(nodeId) {
      return new Set(graph.adjacency[nodeId].map(edge => edge.to)).size;
    }

    function findCandidateStartNodes(coordOrLatLng, radius = CONFIG.defaultSearchRadius) {
      const coord = Array.isArray(coordOrLatLng)
        ? coordOrLatLng
        : [coordOrLatLng.lng, coordOrLatLng.lat];
      const candidates = [];

      graph.nodes.forEach(node => {
        const distance = turf.distance(coord, node.coord, { units: "meters" });
        if (distance > radius) return;
        const directions = nodeDirectionCount(node.id);
        const cyclic = graph.cyclicCore.has(node.id);
        if (directions < 2 || !cyclic) return;
        const quality =
          distance / Math.max(radius, 1) +
          (directions >= 3 ? -0.55 : 0.18) +
          (directions >= 4 ? -0.12 : 0);
        candidates.push({ nodeId: node.id, distance, directions, quality });
      });

      candidates.sort((a, b) => a.quality - b.quality || a.distance - b.distance);
      const selected = [];
      for (const candidate of candidates) {
        const separated = selected.every(existing =>
          turf.distance(
            graph.nodes[candidate.nodeId].coord,
            graph.nodes[existing.nodeId].coord,
            { units: "meters" }
          ) >= 18
        );
        if (separated || selected.length === 0) selected.push(candidate);
        if (selected.length >= 6) break;
      }
      return selected;
    }

    class MinHeap {
      constructor() { this.items = []; }
      get size() { return this.items.length; }

      push(item) {
        this.items.push(item);
        let index = this.items.length - 1;
        while (index > 0) {
          const parent = Math.floor((index - 1) / 2);
          if (this.items[parent].priority <= item.priority) break;
          this.items[index] = this.items[parent];
          index = parent;
        }
        this.items[index] = item;
      }

      pop() {
        if (!this.items.length) return null;
        const root = this.items[0];
        const last = this.items.pop();
        if (this.items.length && last) {
          let index = 0;
          while (true) {
            const left = index * 2 + 1;
            const right = left + 1;
            if (left >= this.items.length) break;
            let child = left;
            if (right < this.items.length &&
                this.items[right].priority < this.items[left].priority) child = right;
            if (this.items[child].priority >= last.priority) break;
            this.items[index] = this.items[child];
            index = child;
          }
          this.items[index] = last;
        }
        return root;
      }
    }

    function reconstructPath(result, startNodeId, targetNodeId) {
      if (!Number.isFinite(result.dist[targetNodeId])) return null;
      const nodes = [targetNodeId];
      const edges = [];
      let current = targetNodeId;
      let guard = graph.nodes.length + 1;
      while (current !== startNodeId && guard-- > 0) {
        const edgeId = result.prevEdge[current];
        const previous = result.prevNode[current];
        if (edgeId === -1 || previous === -1) return null;
        edges.push(graph.edges[edgeId]);
        nodes.push(previous);
        current = previous;
      }
      if (current !== startNodeId) return null;
      nodes.reverse();
      edges.reverse();
      return { nodes, edges, length: result.dist[targetNodeId] };
    }

    function logicalBaseId(edge) {
      const originalId = edge && edge.properties
        ? Number(edge.properties.edit_original_base_id)
        : NaN;
      return Number.isInteger(originalId) ? originalId : edge.baseId;
    }

    function dijkstra(startNodeId, targetNodeId = null, options = {}) {
      const nodeCount = graph.nodes.length;
      const dist = new Float64Array(nodeCount);
      dist.fill(Infinity);
      const prevNode = new Int32Array(nodeCount);
      const prevEdge = new Int32Array(nodeCount);
      prevNode.fill(-1);
      prevEdge.fill(-1);
      const heap = new MinHeap();
      const penalizedBaseEdges = options.penalizedBaseEdges || new Set();
      const blockedBaseEdges = options.blockedBaseEdges || new Set();
      const blockedLogicalBaseEdges = options.blockedLogicalBaseEdges || new Set();
      const blockedDirectedEdges = options.blockedDirectedEdges || new Set();
      const blockedNodes = options.blockedNodes || new Set();
      const overlapPenalty = Number(options.overlapPenalty) || 1;
      const maxDistance = Number(options.maxDistance) || Infinity;
      dist[startNodeId] = 0;
      heap.push({ nodeId: startNodeId, priority: 0 });

      while (heap.size) {
        const current = heap.pop();
        if (!current || current.priority !== dist[current.nodeId]) continue;
        if (current.priority > maxDistance) break;
        if (targetNodeId !== null && current.nodeId === targetNodeId) break;

        for (const edge of graph.adjacency[current.nodeId]) {
          if (edge.disabled) continue;
          const routeBaseId = logicalBaseId(edge);
          if (blockedBaseEdges.has(edge.baseId) ||
              blockedLogicalBaseEdges.has(routeBaseId)) continue;
          if (blockedDirectedEdges.has(edge.id)) continue;
          if (blockedNodes.has(edge.to) && edge.to !== targetNodeId) continue;
          const factor = penalizedBaseEdges.has(routeBaseId) ? overlapPenalty : 1;
          const nextDistance = current.priority + edge.length * factor;
          if (nextDistance < dist[edge.to] && nextDistance <= maxDistance) {
            dist[edge.to] = nextDistance;
            prevNode[edge.to] = current.nodeId;
            prevEdge[edge.to] = edge.id;
            heap.push({ nodeId: edge.to, priority: nextDistance });
          }
        }
      }

      const result = { dist, prevNode, prevEdge };
      if (targetNodeId !== null) {
        const path = reconstructPath(result, startNodeId, targetNodeId);
        return { ...result, path };
      }
      return result;
    }

    function distancesToNode(targetNodeId) {
      const incoming = graph.nodes.map(() => []);
      graph.edges.forEach(edge => {
        if (!edge.disabled) incoming[edge.to].push(edge);
      });
      const dist = new Float64Array(graph.nodes.length);
      dist.fill(Infinity);
      dist[targetNodeId] = 0;
      const heap = new MinHeap();
      heap.push({ nodeId: targetNodeId, priority: 0 });
      while (heap.size) {
        const current = heap.pop();
        if (!current || current.priority !== dist[current.nodeId]) continue;
        for (const edge of incoming[current.nodeId]) {
          const nextDistance = current.priority + edge.length;
          if (nextDistance < dist[edge.from]) {
            dist[edge.from] = nextDistance;
            heap.push({ nodeId: edge.from, priority: nextDistance });
          }
        }
      }
      return dist;
    }

    function yenKShortestPaths(startNodeId, endNodeId, maximumPaths) {
      const first = dijkstra(startNodeId, endNodeId).path;
      let calculations = 1;
      if (!first) return { paths: [], calculations };
      const accepted = [first];
      const acceptedSignatures = new Set([
        first.edges.map(edge => edge.id).join(",")
      ]);
      const candidateMap = new Map();

      while (accepted.length < maximumPaths &&
          calculations < CONFIG.maxRouteCalculations) {
        const previous = accepted[accepted.length - 1];
        for (let spurIndex = 0;
          spurIndex < previous.nodes.length - 1 &&
          calculations < CONFIG.maxRouteCalculations;
          spurIndex++) {
          const rootNodes = previous.nodes.slice(0, spurIndex + 1);
          const rootEdges = previous.edges.slice(0, spurIndex);
          const blockedDirectedEdges = new Set();
          accepted.forEach(path => {
            const sameRoot = rootNodes.every((nodeId, index) =>
              path.nodes[index] === nodeId
            );
            if (sameRoot && path.edges[spurIndex]) {
              blockedDirectedEdges.add(path.edges[spurIndex].id);
            }
          });
          const spur = dijkstra(rootNodes[rootNodes.length - 1], endNodeId, {
            blockedDirectedEdges,
            blockedNodes: new Set(rootNodes.slice(0, -1))
          }).path;
          calculations++;
          if (!spur) continue;
          const nodes = [...rootNodes.slice(0, -1), ...spur.nodes];
          if (new Set(nodes).size !== nodes.length) continue;
          const edges = [...rootEdges, ...spur.edges];
          const signature = edges.map(edge => edge.id).join(",");
          if (acceptedSignatures.has(signature) || candidateMap.has(signature)) continue;
          candidateMap.set(signature, {
            nodes,
            edges,
            length: edges.reduce((sum, edge) => sum + edge.length, 0)
          });
        }
        if (!candidateMap.size) break;
        const next = [...candidateMap.entries()]
          .sort((a, b) => a[1].length - b[1].length)[0];
        candidateMap.delete(next[0]);
        accepted.push(next[1]);
        acceptedSignatures.add(next[0]);
      }
      return { paths: accepted, calculations };
    }

    function calculateOverlap(routeEdges) {
      const counts = new Map();
      routeEdges.forEach(edge => {
        counts.set(edge.baseId, (counts.get(edge.baseId) || 0) + 1);
      });
      let overlapLength = 0;
      counts.forEach((count, baseId) => {
        if (count > 1) {
          const base = graph.baseEdges[baseId];
          overlapLength += (count - 1) * (base ? base.length : 0);
        }
      });
      return overlapLength;
    }

    function scoreRoute(route, targetDistance, searchRadius) {
      const distanceDeviation =
        Math.abs(route.length - targetDistance) / targetDistance;
      const overlapRatio = route.overlapLength / route.length;
      const startDistanceRatio =
        route.startDistance / Math.max(searchRadius, 1);
      const score =
        5 * distanceDeviation +
        4 * overlapRatio +
        0.5 * startDistanceRatio +
        route.immediateTurnaroundPenalty;
      return {
        score,
        distanceDeviation,
        overlapRatio,
        startDistanceRatio
      };
    }

    function scorePointToPointRoute(route, referenceDistance, searchRadius = 250) {
      const distanceDeviation = Math.abs(route.length - referenceDistance) /
        Math.max(referenceDistance, 1);
      const overlapRatio = route.overlapLength / Math.max(route.length, 1);
      const snapDistanceRatio = (route.startDistance + route.endDistance) /
        (2 * Math.max(searchRadius, 1));
      return {
        score:
          5 * distanceDeviation +
          4 * overlapRatio +
          0.5 * snapDistanceRatio +
          route.immediateTurnaroundPenalty,
        distanceDeviation,
        overlapRatio,
        startDistanceRatio: route.startDistance / Math.max(searchRadius, 1),
        endDistanceRatio: route.endDistance / Math.max(searchRadius, 1)
      };
    }

    function angularDifference(a, b) {
      const raw = Math.abs(a - b) % 360;
      return Math.min(raw, 360 - raw);
    }

    function chooseWaypointNodes(startNodeId, tree, targetDistance, limit = 6) {
      const startCoord = graph.nodes[startNodeId].coord;
      const pool = [];
      graph.nodes.forEach(node => {
        if (node.id === startNodeId || !Number.isFinite(tree.dist[node.id])) return;
        const networkDistance = tree.dist[node.id];
        if (networkDistance < targetDistance * 0.28 ||
            networkDistance > targetDistance * 0.64) return;
        if (nodeDirectionCount(node.id) < 2) return;
        const bearing = turf.bearing(turf.point(startCoord), turf.point(node.coord));
        const closeness = Math.abs(networkDistance - targetDistance * 0.46) /
          targetDistance;
        pool.push({ nodeId: node.id, bearing, networkDistance, closeness });
      });
      pool.sort((a, b) => a.closeness - b.closeness);

      const selected = [];
      for (const candidate of pool) {
        const addsVariety = selected.every(other =>
          angularDifference(candidate.bearing, other.bearing) >= 28 ||
          Math.abs(candidate.networkDistance - other.networkDistance) >= targetDistance * 0.1
        );
        if (addsVariety || selected.length < 2) selected.push(candidate);
        if (selected.length >= limit) break;
      }
      return selected;
    }

    function routeCoordinates(startNodeId, edges) {
      const coords = [];
      edges.forEach(edge => {
        const base = graph.baseEdges[edge.baseId];
        if (!base) return;
        const edgeCoords = edge.reversed
          ? [...base.coordinates].reverse()
          : base.coordinates;
        if (!coords.length) {
          edgeCoords.forEach(coord => coords.push(coord));
        } else {
          edgeCoords.slice(1).forEach(coord => coords.push(coord));
        }
      });
      if (!coords.length) coords.push(graph.nodes[startNodeId].coord);
      return coords;
    }

    function directedEdgeCoordinates(edge) {
      const base = graph.baseEdges[edge.baseId];
      if (!base) return [];
      return edge.reversed
        ? [...base.coordinates].reverse()
        : base.coordinates;
    }

    function cloneRoute(route) {
      return {
        ...route,
        edges: [...route.edges],
        nodes: [...route.nodes],
        coordinates: route.coordinates.map(coord => [...coord]),
        waypoints: (route.waypoints || []).map(waypoint => ({ ...waypoint })),
        legEndEdgeIndexes: [...(route.legEndEdgeIndexes || [])]
      };
    }

    function routeSignature(route) {
      return route.edges
        .map(edge => `${logicalBaseId(edge)}:${edge.from}>${edge.to}`)
        .join("|") + `#${(route.waypoints || []).map(waypoint =>
          waypoint.coord.map(value => Number(value).toFixed(7)).join(",")
        ).join("|")}`;
    }

    function findDirectedBaseEdge(baseId, from, to) {
      return graph.adjacency[from].find(edge =>
        !edge.disabled && edge.baseId === baseId && edge.to === to
      ) || null;
    }

    function baseIsRoutable(baseId) {
      return graph.edges.some(edge => !edge.disabled && edge.baseId === baseId);
    }

    function validateRouteEdgeChain(route, edges) {
      let current = route.startNodeId;
      for (const edge of edges) {
        if (edge.from !== current) return false;
        current = edge.to;
      }
      const expectedEnd = route.routeType === "pointToPoint"
        ? route.endNodeId
        : route.startNodeId;
      return current === expectedEnd;
    }

    function clearEditLayers() {
      if (appState.edit.graphBeforePreview) {
        graph = appState.edit.graphBeforePreview;
        appState.edit.graphBeforePreview = null;
      }
      editHitLayers.forEach(layer => map.removeLayer(layer));
      editHitLayers = [];
      [editSourceHighlight, editTargetHighlight, editHandleMarker].forEach(layer => {
        if (layer) map.removeLayer(layer);
      });
      editSourceHighlight = null;
      editTargetHighlight = null;
      editHandleMarker = null;
      editHandleOrigin = null;
      appState.edit.sourceEdgeIndex = null;
      if (appState.edit.previewLayer) map.removeLayer(appState.edit.previewLayer);
      appState.edit.previewLayer = null;
      appState.edit.previewRoute = null;
      editActionsElement.classList.remove("previewing");
    }

    function hideUnselectedRoutesForEditing() {
      routeLayers.forEach((routeLayer, index) => {
        if (index === selectedRouteIndex) return;
        if (map.hasLayer(routeLayer.halo)) map.removeLayer(routeLayer.halo);
        if (map.hasLayer(routeLayer.line)) map.removeLayer(routeLayer.line);
      });
      appPanel.classList.add("editing-route");
    }

    function restoreRoutesAfterEditing() {
      appPanel.classList.remove("editing-route");
      const selectedLayer = routeLayers[selectedRouteIndex];
      if (selectedLayer && map.hasLayer(selectedLayer.line)) {
        selectedLayer.halo.bringToFront();
        selectedLayer.line.bringToFront();
      }
    }

    function updateEditControls() {
      const route = currentRoutes[selectedRouteIndex];
      editActionsElement.classList.toggle("hidden", !route);
      if (!route) return;
      const history = routeEditHistories[selectedRouteIndex] || [];
      undoEditButton.disabled = history.length === 0;
      const original = originalRoutes[selectedRouteIndex];
      resetEditButton.disabled = !original ||
        routeSignature(route) === routeSignature(original);
    }

    function endEditMode() {
      clearEditLayers();
      restoreRoutesAfterEditing();
      setInteraction(currentRoutes.length
        ? INTERACTION.RESULTS
        : (activeRouteType() === "pointToPoint"
          ? (appState.points.end ? INTERACTION.READY_AB :
            (appState.points.start ? INTERACTION.PICK_B : INTERACTION.PICK_A))
          : INTERACTION.PICK_LOOP_START));
      editRouteButton.classList.remove("active");
      editRouteButton.textContent = "Route aanpassen";
      editHintElement.classList.add("hidden");
      updateEditControls();
    }

    function showEditTarget(baseId) {
      if (editTargetHighlight) map.removeLayer(editTargetHighlight);
      const base = graph.baseEdges[baseId];
      if (!base) return;
      editTargetHighlight = L.polyline(
        base.coordinates.map(coord => [coord[1], coord[0]]),
        { color: "#00856a", weight: 7, opacity: 0.92, interactive: false }
      ).addTo(map);
    }

    function findNearestEditableBaseEdge(latLng, maximumDistance = 60) {
      const route = currentRoutes[selectedRouteIndex];
      if (!route) return null;
      const used = new Set(route.edges.map(logicalBaseId));
      const point = turf.point([latLng.lng, latLng.lat]);
      let nearest = null;
      graph.baseEdges.forEach(base => {
        if (base.virtual) return;
        if (used.has(base.id) || !baseIsRoutable(base.id)) return;
        const snapped = turf.nearestPointOnLine(
          turf.lineString(base.coordinates),
          point,
          { units: "meters" }
        );
        const distance = Number(snapped.properties.dist);
        if (Number.isFinite(distance) && distance <= maximumDistance &&
            (!nearest || distance < nearest.distance)) {
          nearest = {
            baseId: base.id,
            distance,
            latLng: L.latLng(snapped.geometry.coordinates[1], snapped.geometry.coordinates[0])
          };
        }
      });
      return nearest;
    }

    function addWaypointAtNetworkPosition(target) {
      const base = graph.baseEdges[target.baseId];
      if (!base || !baseIsRoutable(base.id)) return null;
      const point = turf.point([target.latLng.lng, target.latLng.lat]);
      const snapped = turf.nearestPointOnLine(
        turf.lineString(base.coordinates),
        point,
        { units: "meters" }
      );
      const coord = snapped.geometry.coordinates.map(Number);
      const location = Number(snapped.properties.location) || 0;
      const segmentIndex = Math.max(0, Math.min(
        base.coordinates.length - 2,
        Number(snapped.properties.index) || 0
      ));
      if (location <= 0.2) {
        return { nodeId: base.from, coord, originalBaseId: base.id, kind: "user" };
      }
      if (base.length - location <= 0.2) {
        return { nodeId: base.to, coord, originalBaseId: base.id, kind: "user" };
      }

      const forwardAllowed = Boolean(findDirectedBaseEdge(base.id, base.from, base.to));
      const backwardAllowed = Boolean(findDirectedBaseEdge(base.id, base.to, base.from));
      const nodeId = addTemporaryNode(coord);
      const snapPosition = { coord, index: segmentIndex, location, nodeId };
      const fromPosition = {
        coord: base.coordinates[0], index: -1, location: 0, nodeId: base.from
      };
      const toPosition = {
        coord: base.coordinates[base.coordinates.length - 1],
        index: base.coordinates.length - 1,
        location: base.length,
        nodeId: base.to
      };
      [
        [fromPosition, snapPosition],
        [snapPosition, toPosition]
      ].forEach(([from, to]) => {
        const coordinates = coordinatesBetweenPositions(base, from, to);
        const length = turf.length(turf.lineString(coordinates), {
          units: "kilometers"
        }) * 1000;
        addGraphConnection(graph, from.nodeId, to.nodeId, {
          length,
          coordinates,
          properties: {
            ...base.properties,
            edit_waypoint: true,
            edit_original_base_id: base.id
          },
          virtual: true,
          forward: forwardAllowed,
          backward: backwardAllowed
        });
      });
      return { nodeId, coord, originalBaseId: base.id, kind: "user" };
    }

    function buildRouteThroughWaypoints(route, sourceEdgeIndex, newWaypoint) {
      const sourceEdge = route.edges[sourceEdgeIndex];
      if (!sourceEdge || !newWaypoint) return null;
      const allowOverlap = document.getElementById("allowOverlapInput").checked;
      const targetDistance = Number(document.getElementById("distanceInput").value) || route.length;
      const searchRadius = Number(document.getElementById("radiusInput").value) ||
        CONFIG.defaultSearchRadius;
      const endNodeId = route.routeType === "pointToPoint"
        ? route.endNodeId
        : route.startNodeId;
      const existingWaypoints = [...(route.waypoints || [])];
      const legEnds = route.legEndEdgeIndexes || [];
      let insertIndex = existingWaypoints.length;
      if (legEnds.length) {
        const legIndex = legEnds.findIndex(edgeEnd => sourceEdgeIndex < edgeEnd);
        if (legIndex >= 0) insertIndex = legIndex;
      }
      const waypoints = [...existingWaypoints];
      waypoints.splice(insertIndex, 0, newWaypoint);
      const candidates = [];

      CONFIG.overlapPenalties.forEach(overlapPenalty => {
        const usedBaseIds = new Set();
        const blockedWaypointBases = new Set(
          waypoints.map(waypoint => waypoint.originalBaseId)
        );
        blockedWaypointBases.add(logicalBaseId(sourceEdge));
        const sequence = [
          route.startNodeId,
          ...waypoints.map(waypoint => waypoint.nodeId),
          endNodeId
        ];
        const edges = [];
        const nodes = [route.startNodeId];
        const candidateLegEnds = [];

        for (let index = 1; index < sequence.length; index++) {
          const from = sequence[index - 1];
          const to = sequence[index];
          if (from === to) {
            candidateLegEnds.push(edges.length);
            continue;
          }
          const blockedBaseEdges = new Set(blockedWaypointBases);
          const blockedLogicalBaseEdges = new Set([logicalBaseId(sourceEdge)]);
          if (!allowOverlap) {
            usedBaseIds.forEach(baseId => blockedLogicalBaseEdges.add(baseId));
          }
          const result = dijkstra(from, to, {
            blockedBaseEdges,
            blockedLogicalBaseEdges,
            penalizedBaseEdges: usedBaseIds,
            overlapPenalty
          });
          if (!result.path) return;
          result.path.edges.forEach(edge => usedBaseIds.add(logicalBaseId(edge)));
          edges.push(...result.path.edges);
          nodes.push(...result.path.nodes.slice(1));
          candidateLegEnds.push(edges.length);
        }
        if (!validateRouteEdgeChain(route, edges)) return;
        const length = edges.reduce((sum, edge) => sum + edge.length, 0);
        const overlapLength = calculateOverlap(edges);
        const overlapRatio = overlapLength / Math.max(length, 1);
        if ((!allowOverlap && overlapRatio > 1e-9) ||
            (allowOverlap && overlapRatio > CONFIG.maxOverlap + 1e-9)) return;
        const checkedNodes = route.routeType === "pointToPoint" ? nodes : nodes.slice(0, -1);
        const repeatedNodes = checkedNodes.length - new Set(checkedNodes).size;
        if (!allowOverlap && repeatedNodes > 0) return;
        const immediateTurnaround = edges.some((edge, index) =>
          index > 0 && logicalBaseId(edge) === logicalBaseId(edges[index - 1])
        );
        const candidate = {
          ...route,
          waypoints,
          legEndEdgeIndexes: candidateLegEnds,
          edges,
          nodes,
          length,
          overlapLength,
          immediateTurnaroundPenalty: immediateTurnaround ? 0.75 : 0,
          edited: true
        };
        if (route.routeType === "pointToPoint") {
          const referenceDistance = route.routePreference === "shortest"
            ? route.shortestLength
            : targetDistance;
          Object.assign(candidate, scorePointToPointRoute(
            candidate,
            referenceDistance,
            route.snapSearchRadius || searchRadius
          ));
        } else {
          Object.assign(candidate, scoreRoute(candidate, targetDistance, searchRadius));
        }
        candidate.score += repeatedNodes * 0.4;
        candidate.coordinates = routeCoordinates(candidate.startNodeId, edges);
        candidates.push(candidate);
      });

      return removeDuplicateRoutes(candidates)
        .sort((a, b) => a.score - b.score)[0] || null;
    }

    function findNearestRouteEdgeIndex(route, latLng, maximumDistance = 30) {
      const point = turf.point([latLng.lng, latLng.lat]);
      let nearestIndex = null;
      let nearestDistance = Infinity;
      route.edges.forEach((edge, edgeIndex) => {
        const coordinates = directedEdgeCoordinates(edge);
        if (coordinates.length < 2) return;
        const snapped = turf.nearestPointOnLine(
          turf.lineString(coordinates),
          point,
          { units: "meters" }
        );
        const distance = Number(snapped.properties.dist);
        if (Number.isFinite(distance) && distance < nearestDistance) {
          nearestDistance = distance;
          nearestIndex = edgeIndex;
        }
      });
      return nearestDistance <= maximumDistance ? nearestIndex : null;
    }

    function stopLeafletClick(event) {
      if (event && event.originalEvent) {
        L.DomEvent.stopPropagation(event.originalEvent);
      }
    }

    function selectEditSource(edgeIndex, latLng) {
      const route = currentRoutes[selectedRouteIndex];
      const edge = route && route.edges[edgeIndex];
      if (!edge) return;
      appState.edit.sourceEdgeIndex = edgeIndex;
      setInteraction(INTERACTION.EDIT_TARGET);
      if (editSourceHighlight) map.removeLayer(editSourceHighlight);
      if (editHandleMarker) map.removeLayer(editHandleMarker);
      if (editTargetHighlight) map.removeLayer(editTargetHighlight);
      editTargetHighlight = null;

      const coordinates = directedEdgeCoordinates(edge);
      editSourceHighlight = L.polyline(
        coordinates.map(coord => [coord[1], coord[0]]),
        { color: "#e56a00", weight: 8, opacity: 1, interactive: false }
      ).addTo(map);
      const snapped = turf.nearestPointOnLine(
        turf.lineString(coordinates),
        turf.point([latLng.lng, latLng.lat]),
        { units: "meters" }
      );
      const handleLatLng = L.latLng(
        snapped.geometry.coordinates[1],
        snapped.geometry.coordinates[0]
      );
      editHandleOrigin = handleLatLng;
      editHandleMarker = L.marker(handleLatLng, {
        draggable: true,
        zIndexOffset: 1400,
        icon: L.divIcon({ className: "edit-handle", html: "", iconSize: [22, 22] })
      }).addTo(map);
      editHandleMarker.on("drag", event => {
        const nearest = findNearestEditableBaseEdge(event.target.getLatLng());
        if (nearest) showEditTarget(nearest.baseId);
        else if (editTargetHighlight) {
          map.removeLayer(editTargetHighlight);
          editTargetHighlight = null;
        }
      });
      editHandleMarker.on("dragend", event => {
        const nearest = findNearestEditableBaseEdge(event.target.getLatLng());
        if (nearest) {
          event.target.setLatLng(nearest.latLng);
          previewRouteDetour(nearest);
        } else {
          event.target.setLatLng(editHandleOrigin);
          editHintElement.textContent = "Geen ander pad binnen 60 meter gevonden.";
        }
      });
      editHintElement.textContent =
        "Sleep het oranje punt naar een ander pad, of tik dat pad op de kaart.";
    }

    function beginEditMode() {
      const route = currentRoutes[selectedRouteIndex];
      if (!route) return;
      clearEditLayers();
      setInteraction(INTERACTION.EDIT_SOURCE);
      hideUnselectedRoutesForEditing();
      editRouteButton.classList.add("active");
      editRouteButton.textContent = "Stop aanpassen";
      editHintElement.textContent = "Tik eerst op het routeonderdeel dat je wilt vervangen.";
      editHintElement.classList.remove("hidden");

      route.edges.forEach((edge, edgeIndex) => {
        const sourceLayer = L.polyline(
          directedEdgeCoordinates(edge).map(coord => [coord[1], coord[0]]),
          { color: "#dd001c", weight: 18, opacity: 0.01, bubblingMouseEvents: false }
        ).addTo(map);
        sourceLayer.on("click", event => {
          stopLeafletClick(event);
          selectEditSource(edgeIndex, event.latlng);
        });
        editHitLayers.push(sourceLayer);
      });
    }

    function previewRouteDetour(target) {
      const route = currentRoutes[selectedRouteIndex];
      if (!route || appState.edit.sourceEdgeIndex === null) return;
      editHintElement.textContent = "Voorbeeld wordt berekend…";
      const graphSnapshot = cloneRoutingGraph(graph);
      const waypoint = addWaypointAtNetworkPosition(target);
      const editedRoute = buildRouteThroughWaypoints(
        route,
        appState.edit.sourceEdgeIndex,
        waypoint
      );
      if (!editedRoute) {
        graph = graphSnapshot;
        const openRoute = route.routeType === "pointToPoint";
        editHintElement.textContent = document.getElementById("allowOverlapInput").checked
          ? `Langs dit pad is geen geldige ${openRoute ? "A→B-" : "gesloten "}omleiding met maximaal 35% overlap gevonden.`
          : `Langs dit pad is geen ${openRoute ? "A→B-" : "gesloten "}omleiding zonder overlap gevonden.`;
        return;
      }
      editHitLayers.forEach(layer => map.removeLayer(layer));
      editHitLayers = [];
      appState.edit.graphBeforePreview = graphSnapshot;
      appState.edit.previewRoute = editedRoute;
      appState.edit.previewLayer = L.polyline(
        editedRoute.coordinates.map(coord => [coord[1], coord[0]]),
        {
          color: "#00856a",
          weight: 7,
          opacity: 0.95,
          dashArray: "8 6",
          lineCap: "round",
          lineJoin: "round",
          interactive: false
        }
      ).addTo(map);
      editActionsElement.classList.add("previewing");
      setInteraction(INTERACTION.EDIT_PREVIEW);
      const tolerance = Number(document.getElementById("toleranceInput").value) / 100;
      const usesTolerance = route.routeType !== "pointToPoint" ||
        route.routePreference === "distance";
      const toleranceWarning = usesTolerance &&
        Number.isFinite(tolerance) &&
        editedRoute.distanceDeviation > tolerance
        ? " Buiten de ingestelde tolerantie."
        : "";
      editHintElement.textContent =
        `Voorbeeld: ${numberNL.format(editedRoute.length)} meter · ` +
        `afwijking ${decimalNL.format(editedRoute.distanceDeviation * 100)}% · ` +
        `overlap ${decimalNL.format(editedRoute.overlapRatio * 100)}%.` +
        toleranceWarning;
      map.fitBounds(appState.edit.previewLayer.getBounds(), {
        padding: [42, 42],
        maxZoom: 17
      });
    }

    function confirmEditPreview() {
      const route = currentRoutes[selectedRouteIndex];
      const preview = appState.edit.previewRoute;
      if (!route || !preview) return;
      routeEditHistories[selectedRouteIndex].push(cloneRoute(route));
      const routeIndex = selectedRouteIndex;
      appState.edit.graphBeforePreview = null;
      endEditMode();
      replaceDisplayedRoute(routeIndex, preview, true);
      setStatus(
        "Route via het waypoint herberekend. Afstand en overlap zijn bijgewerkt.",
        "ready"
      );
    }

    function cancelEditPreview() {
      endEditMode();
      setStatus("De routewijziging is geannuleerd.", "ready");
    }

    function removeDuplicateRoutes(routes) {
      const unique = [];
      const exactSignatures = new Set();
      const sorted = [...routes].sort((a, b) => a.score - b.score);
      for (const route of sorted) {
        const exactSignature = routeSignature(route);
        if (exactSignatures.has(exactSignature)) continue;
        const routeSet = new Set(route.edges.map(logicalBaseId));
        const duplicate = unique.some(existing => {
          const existingSet = new Set(existing.edges.map(logicalBaseId));
          let intersection = 0;
          routeSet.forEach(id => {
            if (existingSet.has(id)) intersection++;
          });
          const union = new Set([...routeSet, ...existingSet]).size;
          const similarity = union ? intersection / union : 1;
          const lengthDifference = Math.abs(route.length - existing.length) /
            Math.max(route.length, existing.length);
          return similarity >= 0.78 && lengthDifference <= 0.12;
        });
        if (!duplicate) {
          unique.push(route);
          exactSignatures.add(exactSignature);
        }
      }
      return unique;
    }

    function generateLoops(
      startCandidates,
      targetDistance,
      tolerance,
      searchRadius,
      maxResults = CONFIG.maxResults,
      maxOverlap = CONFIG.maxOverlap
    ) {
      const routes = [];
      let calculations = 0;

      for (const start of startCandidates) {
        if (calculations >= CONFIG.maxRouteCalculations) break;
        const outboundTree = dijkstra(start.nodeId, null, {
          maxDistance: targetDistance * 0.72
        });
        calculations++;
        const waypoints = chooseWaypointNodes(
          start.nodeId,
          outboundTree,
          targetDistance,
          Math.min(14, Math.max(6, maxResults + 3))
        );

        for (const waypoint of waypoints) {
          const outbound = reconstructPath(outboundTree, start.nodeId, waypoint.nodeId);
          if (!outbound) continue;
          const outboundBaseIds = new Set(outbound.edges.map(logicalBaseId));

          for (const overlapPenalty of CONFIG.overlapPenalties) {
            if (calculations >= CONFIG.maxRouteCalculations) break;
            const inboundResult = dijkstra(waypoint.nodeId, start.nodeId, {
              penalizedBaseEdges: outboundBaseIds,
              overlapPenalty,
              maxDistance: targetDistance * 1.35
            });
            calculations++;
            const inbound = inboundResult.path;
            if (!inbound) continue;

            const edges = [...outbound.edges, ...inbound.edges];
            const nodes = [...outbound.nodes, ...inbound.nodes.slice(1)];
            if (nodes[0] !== nodes[nodes.length - 1]) continue;
            const length = edges.reduce((sum, edge) => sum + edge.length, 0);
            const distanceDeviation = Math.abs(length - targetDistance) / targetDistance;
            if (distanceDeviation > tolerance) continue;
            const overlapLength = calculateOverlap(edges);
            const overlapRatio = overlapLength / Math.max(length, 1);
            if (overlapRatio > maxOverlap + 1e-9) continue;

            const immediateTurnaround =
              outbound.edges.length > 0 &&
              inbound.edges.length > 0 &&
              logicalBaseId(outbound.edges[outbound.edges.length - 1]) ===
                logicalBaseId(inbound.edges[0]);
            const route = {
              startNodeId: start.nodeId,
              startDistance: start.distance,
              waypointNodeId: waypoint.nodeId,
              edges,
              nodes,
              length,
              overlapLength,
              overlapPenalty,
              immediateTurnaroundPenalty: immediateTurnaround ? 0.75 : 0
            };
            Object.assign(route, scoreRoute(route, targetDistance, searchRadius));
            route.coordinates = routeCoordinates(start.nodeId, edges);
            routes.push(route);
          }
        }
      }

      const result = removeDuplicateRoutes(routes)
        .sort((a, b) => a.score - b.score)
        .slice(0, maxResults);
      console.log(
        `Routezoekactie: ${calculations} berekeningen, ${routes.length} geldige ` +
        `kandidaten en ${result.length} unieke resultaten.`
      );
      return result;
    }

    function generatePointToPointRoutes(
      endpoints,
      preference,
      targetDistance,
      tolerance,
      maxResults = CONFIG.maxResults,
      maxOverlap = CONFIG.maxOverlap
    ) {
      const startNodeId = endpoints.start.nodeId;
      const endNodeId = endpoints.end.nodeId;
      const directResult = dijkstra(startNodeId, endNodeId);
      let calculations = 1;
      if (!directResult.path) return [];
      const shortestLength = directResult.path.length;
      const referenceDistance = preference === "shortest"
        ? shortestLength
        : targetDistance;
      const routes = [];

      function addCandidate(edges, nodes, source) {
        if (!edges.length || nodes[0] !== startNodeId ||
            nodes[nodes.length - 1] !== endNodeId) return;
        const length = edges.reduce((sum, edge) => sum + edge.length, 0);
        const distanceDeviation = Math.abs(length - referenceDistance) /
          Math.max(referenceDistance, 1);
        if (preference === "distance" && distanceDeviation > tolerance) return;
        if (preference === "shortest" && length > shortestLength * 1.75) return;
